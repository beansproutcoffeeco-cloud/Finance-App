<title>Finance Tracker</title>
<style>
:root {
  --page: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #807e78;
  --text-warning: #9a6a00;
  --grid: #e1e0d9;
  --baseline: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6;   /* spending / default */
  --series-2: #1baf7a;   /* income */
  --meter-track: color-mix(in srgb, var(--text-primary) 8%, transparent);
  --good-text: #006300;
  --critical: #d03b3b;
  --danger-wash: color-mix(in srgb, var(--critical) 12%, var(--surface-1));
  --warning: #fab219;
  --accent: #2a78d6;
  --wash: rgba(42,120,214,0.08);
  --focus: var(--accent);
  /* spacing */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
  /* radii */
  --r-s: 8px; --r-m: 12px; --r-l: 16px; --r-xl: 20px;
  /* type scale */
  --fs-caption: 12px; --fs-body-s: 13px; --fs-body: 15px; --fs-h2: 16px;
  --fs-h1: 22px; --fs-stat: 24px; --fs-hero: clamp(32px, 9vw, 40px);
  /* elevation */
  --shadow-1: 0 1px 2px rgba(11,11,11,0.05);
  --shadow-2: 0 8px 30px rgba(11,11,11,0.18);
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0d0d0d;
    --surface-1: #1a1a19;
    --surface-2: #242423;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #98968f;
    --text-warning: #fab219;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --series-2: #199e70;
    --meter-track: rgba(57,135,229,.20);
    --good-text: #0ca30c;
    --accent: #3987e5;
    --wash: rgba(57,135,229,0.14);
    --shadow-1: none;
    --shadow-2: 0 8px 30px rgba(0,0,0,0.5);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page);
  color: var(--text-primary);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: var(--fs-body);
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
main {
  max-width: 720px;
  margin: 0 auto;
  padding: 12px 14px calc(84px + env(safe-area-inset-bottom));
}
h1 { font-size: var(--fs-h1); margin: 8px 2px 12px; }
h2 { font-size: var(--fs-h2); font-weight: 600; margin: 0 0 10px; }
.sub { color: var(--text-secondary); font-size: var(--fs-body-s); }
.muted { color: var(--text-muted); }

.card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--r-l);
  padding: var(--sp-4);
  margin-bottom: 12px;
  box-shadow: var(--shadow-1);
}

/* ---- tab bar ---- */
nav.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex;
  background: var(--surface-1);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 40;
}
nav.tabbar button {
  flex: 1; border: 0; background: none; cursor: pointer;
  padding: 6px 0 5px;
  font: inherit; font-size: 11px;
  color: var(--text-muted);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
nav.tabbar button .ico {
  display: flex; align-items: center; justify-content: center;
  width: 52px; height: 27px; border-radius: 999px;
}
nav.tabbar button .ico svg { display: block; }
nav.tabbar button.active { color: var(--accent); font-weight: 600; }
nav.tabbar button.active .ico { background: var(--wash); }
@media (min-width: 700px) {
  nav.tabbar {
    max-width: 720px; margin: 0 auto;
    border: 1px solid var(--border); border-bottom: 0;
    border-radius: var(--r-l) var(--r-l) 0 0;
  }
}

/* ---- controls ---- */
input, select, textarea, button { font: inherit; color: inherit; }
input[type=text], input[type=number], input[type=date], input[type=search], select, textarea {
  background: var(--page);
  border: 1px solid var(--border);
  border-radius: var(--r-m);
  padding: 8px 10px;
  width: 100%;
  color: var(--text-primary);
}
input[type=text], input[type=number], input[type=date], input[type=search], select { min-height: 44px; }
textarea { resize: vertical; }
label.fld { display: block; margin-bottom: 10px; font-size: 13px; color: var(--text-secondary); }
label.fld > span { display: block; margin-bottom: 4px; }
.btn {
  background: var(--accent); color: #fff; border: 0;
  border-radius: var(--r-m); padding: 9px 16px; cursor: pointer; font-weight: 600;
  min-height: 44px;
}
.btn.secondary { background: none; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.btn.danger { background: var(--critical); }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: var(--r-s); min-height: 36px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:not(.secondary):not(.danger):not(:disabled):hover { background: color-mix(in srgb, var(--accent) 85%, var(--text-primary)); }
.btn.secondary:not(:disabled):hover { background: var(--wash); }
.btn.danger:not(:disabled):hover { background: color-mix(in srgb, var(--critical) 85%, var(--text-primary)); }
.btn:not(:disabled):active { transform: scale(.98); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1; }
.right { margin-left: auto; }

/* ---- stat tiles ---- */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--r-l); padding: 12px var(--sp-4); box-shadow: var(--shadow-1); }
.tile .lbl { font-size: 12.5px; color: var(--text-secondary); }
.tile .val { font-size: var(--fs-stat); font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.tile .delta { font-size: 12px; margin-top: 2px; }
.tile.hero { grid-column: 1 / -1; background: color-mix(in srgb, var(--accent) 7%, var(--surface-1)); }
.tile.hero .val { font-size: var(--fs-hero); font-weight: 650; }
.tile.hero .val .cents { font-size: 60%; color: var(--text-secondary); font-weight: 600; }
@media (min-width: 700px) {
  .tiles { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
}
.delta.good { color: var(--good-text); }
.delta.bad { color: var(--critical); }
.tile[data-drill] { cursor: pointer; }
.tile[data-drill]:hover { border-color: var(--accent); }
.txn:focus-visible, .cbar .crow:focus-visible, .tile[data-drill]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

/* ---- month picker ---- */
.monthpick { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 2px 0 12px; }
.monthpick button {
  border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
  border-radius: 9px; width: 34px; height: 34px; cursor: pointer; font-size: 16px;
}
.monthpick .cur { font-weight: 600; min-width: 150px; text-align: center; cursor: pointer; border-radius: 8px; padding: 4px 6px; }
.monthpick .cur:hover { background: var(--wash); }
.monthpick input[type=month] { width: auto; min-width: 150px; text-align: center; }

/* ---- category bar list ---- */
.cbar { display: flex; flex-direction: column; gap: 4px; }
.cbar .crow { display: grid; grid-template-columns: minmax(104px, 140px) 1fr auto; gap: 4px 10px; align-items: center; border-radius: 8px; padding: 2px 4px; margin: 0 -4px; }
.cbar .crow[role="button"] { cursor: pointer; }
.cbar .crow[role="button"]:hover { background: var(--wash); }
.cbar .name { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cbar .trackcell { position: relative; height: 22px; display: flex; align-items: center; }
.cbar .bar { height: 16px; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 4px; }
.cbar .amt { font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }

/* ---- budget meters ---- */
.meter { margin-bottom: 12px; }
.meter .top { display: flex; font-size: 13px; margin-bottom: 4px; gap: 8px; }
.meter .top .nm { color: var(--text-secondary); }
.meter .top .st { margin-left: auto; font-variant-numeric: tabular-nums; }
.meter .track { height: 10px; border-radius: 5px; background: var(--meter-track); overflow: hidden; }
.meter .fill { height: 100%; background: var(--series-1); border-radius: 5px 0 0 5px; }
.meter.over .fill { background: var(--critical); }
.meter.over .track { background: var(--danger-wash); }
.meter .overnote { color: var(--critical); font-size: 12px; margin-top: 3px; font-weight: 600; }

/* --- budgets (pkg A) --- */
.tile.wide { grid-column: 1 / -1; }
.meter .track { position: relative; }
.meter.near .fill { background: var(--warning); }
.pace-tick { position: absolute; top: -2px; bottom: -2px; width: 2px; border-radius: 1px; background: var(--text-primary); opacity: .5; }
.meter.overall .track { overflow: visible; }
.meter.overall { margin-bottom: 16px; }
.meter .top { align-items: center; }
.meter .top .iconbtn { padding: 2px 4px; flex: 0 0 auto; }
.meter[data-cat], .meter.unbudgeted { cursor: pointer; border-radius: 8px; padding: 2px 4px; margin: 0 -4px 12px; }
.meter[data-cat]:hover, .meter.unbudgeted:hover { background: var(--wash); }
.meter[data-cat]:focus-visible, .meter.unbudgeted:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.meter.unbudgeted .track { background: none; border: 1px dashed var(--border); }
.meter.unbudgeted .fill { background: var(--text-muted); opacity: .45; }
.budget-editor { background: var(--surface-1); border: 1px solid var(--accent); border-radius: 12px; padding: 12px; margin: -6px 0 12px; }
.ub-list { margin: -6px 0 10px; padding: 0 4px; }
.ub-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); padding: 6px 0; border-bottom: 1px solid var(--grid); }
.ub-row:last-child { border-bottom: 0; }
.ub-row .amt { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--text-primary); }
.budget-setup .bsrow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--grid); }
.budget-setup .bsrow:last-of-type { border-bottom: 0; }
.budget-setup .bsrow input[type=number] { width: 96px; flex: 0 0 auto; margin-left: auto; }
.budget-setup .bsrow .chk { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-primary); flex: 1; min-width: 0; }

/* ---- transactions ---- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.filters > * { flex: 1 1 130px; }
.filters .chk { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary); }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); border-radius: 999px;
  padding: 4px 12px; font-size: 13px; cursor: pointer;
  background: var(--surface-1); color: var(--text-secondary);
}
.chip.on { background: var(--wash); color: var(--accent); border-color: var(--accent); font-weight: 600; }
.dayhdr { font-size: 12px; color: var(--text-muted); margin: 14px 2px 4px; font-weight: 600; }
.txn {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 12px; padding: 9px 12px; margin-bottom: 6px; cursor: pointer;
}
.txn .emoji { font-size: 18px; width: 26px; text-align: center; flex: 0 0 auto; }
.txn .mid { flex: 1; min-width: 0; }
.txn .desc { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.txn .meta { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.txn .amt { font-variant-numeric: tabular-nums; font-weight: 600; flex: 0 0 auto; }
.txn .amt.pos { color: var(--good-text); }
.txn .amt.xfer { color: var(--text-muted); font-weight: 400; }
.txn.uncat { border-left: 3px solid var(--warning); }
.editor { background: var(--surface-2); border: 1px solid var(--accent); border-radius: var(--r-m); padding: 12px; margin: -2px 0 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.grid2 label.fld { margin-bottom: 2px; }

/* ---- chart ---- */
.chartwrap { position: relative; }
.chartwrap svg { display: block; width: 100%; height: auto; }
.legend { display: flex; gap: 12px; font-size: 12.5px; color: var(--text-secondary); margin: 2px 2px 8px; flex-wrap: wrap; }
.legend .key { display: inline-flex; align-items: center; gap: 6px; }
.legend .swatch { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.viz-tooltip {
  position: fixed; z-index: 60; pointer-events: none;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 11px; font-size: 12.5px;
  box-shadow: var(--shadow-2); min-width: 130px;
  display: none;
}
.viz-tooltip .t { color: var(--text-muted); font-size: 11.5px; margin-bottom: 4px; }
.viz-tooltip .r { display: flex; align-items: center; gap: 7px; margin-top: 2px; }
.viz-tooltip .r .k { width: 12px; height: 3px; border-radius: 2px; flex: 0 0 auto; }
.viz-tooltip .r .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.viz-tooltip .r .n { color: var(--text-secondary); margin-left: auto; padding-left: 10px; }

table.mini { width: 100%; border-collapse: collapse; font-size: 13px; }
table.mini th { text-align: left; color: var(--text-muted); font-weight: 600; font-size: 11.5px; padding: 5px 6px; border-bottom: 1px solid var(--grid); }
table.mini td { padding: 5px 6px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
table.mini td.num, table.mini th.num { text-align: right; }
table.mini tr:last-child td { border-bottom: 0; }

/* ---- settings lists ---- */
.setrow { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--grid); }
.setrow:last-child { border-bottom: 0; }
.setrow input[type=text] { flex: 1; }
.setrow input.budget { width: 96px; flex: 0 0 auto; }
.iconbtn {
  border: 0; background: none; cursor: pointer; font-size: 15px; color: var(--text-muted);
  padding: 4px; min-width: 40px; min-height: 40px;
  display: inline-flex; align-items: center; justify-content: center;
}

/* ---- modal ---- */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  background: var(--surface-2); width: 100%; max-width: 680px;
  border-radius: var(--r-xl) var(--r-xl) 0 0; padding: 10px 16px calc(16px + env(safe-area-inset-bottom));
  max-height: 92vh; overflow-y: auto;
  box-shadow: var(--shadow-2);
}
.sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto 12px; }
@media (min-width: 700px) {
  .overlay { align-items: center; }
  .sheet { border-radius: var(--r-xl); max-height: 86vh; padding-top: 16px; }
  .sheet .grab { display: none; }
}
.sheet h2 { font-size: 17px; }
.preview-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
.preview-scroll table.mini { min-width: 420px; }
td.badrow { color: var(--critical); }

#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(74px + env(safe-area-inset-bottom));
  background: var(--text-primary); color: var(--page);
  padding: 9px 16px; border-radius: 999px; font-size: 13.5px;
  z-index: 70; display: none; max-width: 90vw; text-align: center;
  box-shadow: var(--shadow-2);
}
#toast .toast-action {
  margin-left: 12px; background: none; border: 0; padding: 0;
  color: var(--page); font: inherit; font-weight: 700;
  text-decoration: underline; cursor: pointer;
}
.empty { text-align: center; padding: 30px 16px; color: var(--text-secondary); }
.empty .big { font-size: 34px; margin-bottom: 8px; }
.section-title { display: flex; align-items: baseline; gap: 8px; margin: 16px 2px 8px; }
.section-title h2 { margin: 0; }
a { color: var(--accent); }

/* --- visual refresh (pkg B) --- */
/* deferred-to-C:
   - zero-delta copy detail beyond "— same as May" (deltaHtml)
   - consolidating remaining inline style="margin…" in untouched templates
   - Savings per-account balance figure still inline 26px (not tokenized)
   - meter fill width transitions / reduced-motion wrapper
   - monthpick 44px tap targets, chip min-height, aria-live on #toast */

/* focus rings on every interactive control */
.btn:focus-visible, .chip:focus-visible, input:focus-visible, select:focus-visible,
textarea:focus-visible, nav.tabbar button:focus-visible, .iconbtn:focus-visible {
  outline: 2px solid var(--focus); outline-offset: 2px;
}

/* money values read as columns of digits */
.txn .amt, .cbar .amt, .meter .top .st, .viz-tooltip .r .v, table.mini td { font-variant-numeric: tabular-nums; }

/* raised surfaces sit on --surface-2 */
#bulk-bar, .budget-editor { background: var(--surface-2); }

/* budget meters: over rows show spent-full track with a darker overage
   segment past the 100%-of-budget tick, so 105% reads different from 150% */
.meter .overage {
  position: absolute; top: 0; right: 0; height: 100%;
  background: color-mix(in srgb, var(--critical) 60%, #000);
  border-radius: 0 5px 5px 0;
}
.meter .cap-tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--surface-1); }
.meter.near .top .st { color: var(--text-warning); }
.meter .top .iconbtn { min-width: 32px; min-height: 32px; }
.cbar .amt .pct { font-size: 12px; color: var(--text-muted); }

/* category-list header + budget affix field (Settings) */
.sethdr { font-size: 12px; color: var(--text-muted); border-bottom: 1px solid var(--grid); padding: 2px 0 5px; }
.sethdr .grow { flex: 1; }
.moneyfield {
  display: flex; align-items: center; flex: 0 0 auto;
  border: 1px solid var(--border); border-radius: var(--r-m);
  background: var(--page); padding: 0 8px;
}
.moneyfield .aff { font-size: 12px; color: var(--text-muted); flex: 0 0 auto; }
.setrow .moneyfield input.budget { border: 0; background: none; width: 58px; min-height: 42px; padding: 8px 4px; border-radius: 0; }
.moneyfield:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.setrow .moneyfield input.budget:focus-visible { outline: none; }
.danger-zone { border-top: 1px solid var(--border); margin-top: var(--sp-5); padding-top: var(--sp-4); }

/* hidden native file input with a styled proxy button */
.hidden-file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
label.fld > .filelike { display: inline-block; padding: 10px 16px; margin-bottom: 4px; }
.hidden-file:focus-visible ~ .filelike { outline: 2px solid var(--focus); outline-offset: 2px; }

/* form hint under a field label */
.fld .hint { display: block; margin: 4px 0 0; font-size: 12px; color: var(--text-muted); }

/* transaction list: one card per day, hairline separators between rows */
.daygroup {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--r-l); margin-bottom: 8px; overflow: hidden;
  box-shadow: var(--shadow-1);
}
.daygroup .txn { background: none; border: 0; border-bottom: 1px solid var(--grid); border-radius: 0; margin: 0; padding: 10px 12px; }
.daygroup .txn:last-child { border-bottom: 0; }
.daygroup .txn.uncat { border-left: 3px solid var(--warning); padding-left: 9px; }
.daygroup .txn.editing { background: var(--surface-2); border-bottom: 0; }
.daygroup .editor { border: 0; border-left: 3px solid var(--accent); border-bottom: 1px solid var(--grid); border-radius: 0; margin: 0; }
.daygroup .editor:last-child { border-bottom: 0; }

/* search takes the full row on narrow screens */
@media (max-width: 480px) {
  .filters input[type=search] { flex: 1 1 100%; }
}

/* recurring: card list under 600px, table above */
.rec-cards { display: none; }
@media (max-width: 599px) {
  .rec-table { display: none; }
  .rec-cards { display: block; }
}
.rec-card { padding: 10px 2px; border-bottom: 1px solid var(--grid); cursor: pointer; }
.rec-card:last-child { border-bottom: 0; }
.rec-card .rc-name { font-weight: 600; font-size: 14px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rec-card .rc-meta { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; font-variant-numeric: tabular-nums; }
.rec-card .chip { flex: 0 0 auto; min-height: 0; padding: 2px 10px; font-size: 12px; }
</style>

<body>
<main id="app"></main>
<nav class="tabbar" id="tabbar"></nav>
<div class="viz-tooltip" id="viztip"></div>
<div id="modal-root"></div>
<div id="toast"></div>

<script>
'use strict';
/* =====================================================================
   Finance Tracker — single-file, offline, localStorage-backed.
   Data model: { version, accounts, categories, transactions, rules,
                 csvMappings, settings }
   Amounts are integer cents, signed: negative = money out.
   ===================================================================== */

const LS_KEY = 'financeTracker.v1';
const $ = (sel, el) => (el || document).querySelector(sel);
const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/* ---------- seed data ---------- */
// Categorical palette — mid-tone hues chosen to stay legible on both the light
// (#fcfcfb) and dark (#1a1a19) card surfaces. Used for category bars/lines and
// cycled for user-added categories. --series-1 is the safe fallback for old
// records saved before categories had colors.
const CAT_PALETTE = [
  '#2a78d6', '#1baf7a', '#e0803a', '#7b61c4', '#b8558f', '#d0553b',
  '#3aa5b0', '#c25b7c', '#c99a2e', '#5f8bd0', '#6aa84f', '#8a8f98',
];
function seedCategories() {
  const mk = (id, name, emoji, color, kind) => ({ id, name, emoji, color, kind: kind || 'expense', budget: null });
  return [
    mk('housing', 'Housing', '🏠', '#2a78d6'),
    mk('groceries', 'Groceries', '🛒', '#1baf7a'),
    mk('dining', 'Dining', '🍽️', '#e0803a'),
    mk('transport', 'Transport', '🚗', '#7b61c4'),
    mk('shopping', 'Shopping', '🛍️', '#b8558f'),
    mk('subscriptions', 'Subscriptions', '📺', '#d0553b'),
    mk('utilities', 'Utilities', '💡', '#3aa5b0'),
    mk('health', 'Health', '💊', '#c25b7c'),
    mk('entertainment', 'Entertainment', '🎬', '#c99a2e'),
    mk('travel', 'Travel', '✈️', '#5f8bd0'),
    mk('income', 'Income', '💵', '#6aa84f', 'income'),
    mk('other', 'Other', '📦', '#8a8f98'),
    mk('uncat', 'Uncategorized', '❓', '#a0a09a'),
  ];
}

// Keyword seeds applied at import when no learned rule matches. Matched
// against the normalized merchant key (uppercase).
const KEYWORD_RULES = [
  [/NETFLIX|SPOTIFY|HULU|DISNEY|HBO|MAX COM|YOUTUBE|APPLE COM BILL|ICLOUD|AUDIBLE|PARAMOUNT|PEACOCK|PRIME VIDEO/, 'subscriptions'],
  [/UBER EATS|DOORDASH|GRUBHUB|CHIPOTLE|STARBUCKS|MCDONALD|CHICK FIL|TACO|PIZZA|RESTAURANT|CAFE|COFFEE|DUNKIN|BAKERY|SUSHI|GRILL|DINER|BREWERY/, 'dining'],
  [/UBER|LYFT|SHELL|CHEVRON|EXXON|MOBIL|BP |ARCO|GAS |FUEL|PARKING|METRO|TRANSIT|TOLL/, 'transport'],
  [/WHOLE FOODS|WHOLEFDS|TRADER JOE|KROGER|SAFEWAY|ALBERTSONS|ALDI|COSTCO|SAM S CLUB|WEGMANS|PUBLIX|HEB |SPROUTS|GROCERY|MARKET/, 'groceries'],
  [/AMAZON|AMZN|TARGET|WALMART|BEST BUY|EBAY|ETSY|NORDSTROM|MACY|IKEA|HOME DEPOT|LOWE S/, 'shopping'],
  [/RENT|MORTGAGE|LANDLORD|APARTMENT|HOA DUES/, 'housing'],
  [/COMCAST|XFINITY|VERIZON|AT T|T MOBILE|SPECTRUM|ELECTRIC|WATER|SEWER|INTERNET|UTILITY|PG E|CON ED|DUKE ENERGY/, 'utilities'],
  [/CVS|WALGREENS|RITE AID|PHARMACY|DENTAL|MEDICAL|CLINIC|DOCTOR|GYM|FITNESS|PELOTON/, 'health'],
  [/AMC |CINEMA|MOVIE|TICKETMASTER|STEAM|PLAYSTATION|NINTENDO|XBOX|CONCERT/, 'entertainment'],
  [/AIRLINE|AIRWAYS|DELTA AIR|UNITED|SOUTHWES|AMERICAN AIR|HOTEL|AIRBNB|MARRIOTT|HILTON|HERTZ|EXPEDIA/, 'travel'],
  [/PAYROLL|DIRECT DEP|SALARY|PAYCHECK|INTEREST PAID|INTEREST PAYMENT|DIVIDEND|TAX REF|IRS TREAS/, 'income'],
];

const TRANSFER_RE = /TRANSFER|XFER|X FER|PAYMENT THANK YOU|THANK YOU PAYMENT|AUTOPAY|CARDMEMBER SERV|CARD PAYMENT|CRD PMT|ONLINE PAYMENT|ONLINE PMT|EPAY|E PAY|DIRECTPAY|MOBILE PMT|PAYMENT RECEIVED|CAPITAL ONE PYMT|CHASE PYMT|CITI PYMT|AMEX EPAYMENT|VENMO CASHOUT|ACH PMT.*CREDIT CARD/;

function defaultData() {
  return {
    version: 1,
    accounts: [{ id: 'manual', name: 'Cash / Manual', type: 'cash', startingBalance: 0 }],
    categories: seedCategories(),
    transactions: [],
    rules: {},        // merchantKey -> categoryId (learned)
    csvMappings: {},  // accountId -> saved column mapping
    balances: [],     // { id, accountId, date, balance } snapshots for savings/investment
    settings: { currency: 'USD' },
  };
}

let data = loadData();

function loadData() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return defaultData();
    const d = JSON.parse(raw);
    if (!d || !Array.isArray(d.transactions)) return defaultData();
    const base = defaultData();
    for (const k of Object.keys(base)) if (d[k] === undefined) d[k] = base[k];
    // Backfill category colors for records saved before color-coding existed,
    // cycling the palette by position so old data still gets distinct hues.
    if (Array.isArray(d.categories)) {
      d.categories.forEach((c, i) => { if (c && !c.color) c.color = CAT_PALETTE[i % CAT_PALETTE.length]; });
    }
    return d;
  } catch (e) {
    console.error('load failed', e);
    return defaultData();
  }
}

function saveData() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(data));
  } catch (e) {
    toast('⚠️ Could not save — storage may be full');
  }
}

/* ---------- helpers ---------- */
// Currency formatter derived from settings.currency; rebuilt via
// buildFormatter() whenever the setting changes.
let fmtCur, curSymbol;
function buildFormatter() {
  const code = (data.settings && data.settings.currency) || 'USD';
  try {
    fmtCur = new Intl.NumberFormat(undefined, { style: 'currency', currency: code });
  } catch (e) {
    fmtCur = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
    curSymbol = '$';
    return;
  }
  let sym = code;
  try {
    const part = fmtCur.formatToParts(0).find(p => p.type === 'currency');
    if (part) sym = part.value;
  } catch (e) { /* keep code as fallback symbol */ }
  curSymbol = sym;
}
buildFormatter();
function money(cents) { return fmtCur.format(cents / 100); }
function moneyAbs(cents) { return fmtCur.format(Math.abs(cents) / 100); }
function moneyCompact(cents) {
  const v = Math.abs(cents) / 100;
  const s = v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : v >= 1e3 ? (v / 1e3).toFixed(1) + 'K' : Math.round(v).toString();
  return (cents < 0 ? '-' + curSymbol : curSymbol) + s.replace('.0M', 'M').replace('.0K', 'K');
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function monthKey(dateStr) { return dateStr.slice(0, 7); }
function curMonth() { return monthKey(todayStr()); }
function monthAdd(ym, delta) {
  let [y, m] = ym.split('-').map(Number);
  m += delta;
  y += Math.floor((m - 1) / 12);
  m = ((m - 1) % 12 + 12) % 12 + 1;
  return y + '-' + String(m).padStart(2, '0');
}
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthLabel(ym) {
  const [y, m] = ym.split('-').map(Number);
  return MONTH_NAMES[m - 1] + ' ' + y;
}
function monthShort(ym) {
  const [y, m] = ym.split('-').map(Number);
  return MONTH_NAMES[m - 1].slice(0, 3) + ' ’' + String(y).slice(2);
}
function dayDiff(a, b) {
  const p = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  return Math.round((p(b) - p(a)) / 86400000);
}
function dateLabel(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const lbl = MONTH_NAMES[m - 1].slice(0, 3) + ' ' + d + (y !== new Date().getFullYear() ? ', ' + y : '');
  if (dateStr === todayStr()) return 'Today · ' + lbl;
  return lbl;
}
function catById(id) {
  return data.categories.find(c => c.id === id)
    || data.categories.find(c => c.id === 'uncat')
    || { id: 'uncat', name: 'Uncategorized', emoji: '❓', color: '#a0a09a', kind: 'expense', budget: null };
}
// A category's display color, tolerating old records with no color set.
function catColor(cat) { return (cat && cat.color) || 'var(--series-1)'; }
function acctById(id) { return data.accounts.find(a => a.id === id); }
function esc(s) {
  return (s == null ? '' : String(s))
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Savings & investment accounts are excluded from spending/income analytics;
// their activity is tracked in the Savings view instead.
const SAVE_TYPES = ['savings', 'investment'];
const ACCT_TYPE_LABELS = { bank: 'Checking / card', cash: 'Cash', savings: 'Savings', investment: 'Investment' };
function isSavingsAcct(accountId) {
  const a = acctById(accountId);
  return !!a && SAVE_TYPES.includes(a.type);
}

// Net money flow for accounts of the given types in a month
// (transfers in are +, withdrawals -, interest/dividends +, fees -).
function savingsFlow(ym, types, accountId) {
  let sum = 0;
  for (const t of data.transactions) {
    if (monthKey(t.date) !== ym) continue;
    if (accountId && t.accountId !== accountId) continue;
    const a = acctById(t.accountId);
    if (!a || !types.includes(a.type)) continue;
    sum += t.amount;
  }
  return sum;
}

// Balance = latest manual snapshot + transaction flows since (or flows-only if never set).
function acctBalance(acct) {
  const snaps = (data.balances || []).filter(b => b.accountId === acct.id).sort((a, b) => a.date.localeCompare(b.date));
  const snap = snaps.length ? snaps[snaps.length - 1] : null;
  let bal = snap ? snap.balance : 0;
  for (const t of data.transactions) {
    if (t.accountId !== acct.id) continue;
    if (snap && t.date <= snap.date) continue;
    bal += t.amount;
  }
  return { balance: bal, since: snap ? snap.date : null, hasSnap: !!snap };
}

// Investment growth the CSVs can't see: change between first and latest balance
// snapshots minus the money added in between = market gains/losses.
function marketGains(acct) {
  const snaps = (data.balances || []).filter(b => b.accountId === acct.id).sort((a, b) => a.date.localeCompare(b.date));
  if (snaps.length < 2) return null;
  const first = snaps[0], last = snaps[snaps.length - 1];
  let flows = 0;
  for (const t of data.transactions) {
    if (t.accountId !== acct.id) continue;
    if (t.date > first.date && t.date <= last.date) flows += t.amount;
  }
  return { gain: last.balance - first.balance - flows, from: first.date, to: last.date };
}
function titleCase(s) {
  return s.toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase());
}
// CSV-escape a single field: quote when it contains a comma, quote, or
// newline, doubling any internal quotes.
function csvCell(v) {
  const s = v == null ? '' : String(v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

// Show a transient toast. Pass an optional action { label, fn } to render an
// inline button (e.g. Undo) that runs fn and dismisses the toast; the toast
// stays up longer so there's time to act.
function toast(msg, action) {
  const t = $('#toast');
  t.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = msg;
  t.appendChild(span);
  if (action && action.label && typeof action.fn === 'function') {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'toast-action';
    btn.textContent = action.label;
    btn.onclick = () => { hideToast(); action.fn(); };
    t.appendChild(btn);
  }
  t.style.display = 'block';
  clearTimeout(toast._h);
  toast._h = setTimeout(() => { t.style.display = 'none'; }, action ? 6000 : 3200);
}
function hideToast() { const t = $('#toast'); t.style.display = 'none'; clearTimeout(toast._h); }

/* ---------- merchant normalization & rules ---------- */
function merchantKey(desc) {
  let s = (desc || '').toUpperCase();
  s = s.replace(/[^A-Z0-9 ]+/g, ' ');            // punctuation -> space
  s = s.replace(/\b\d{3,}\b/g, ' ');             // long digit runs (store #, dates, refs)
  s = s.replace(/\b(POS|DEBIT|CREDIT|CHECKCARD|CHECK CARD|PURCHASE|ACH|WEB|PPD|CCD|RECURRING|SQ|TST|PY|PAYPAL INST XFER|VISA|MC)\b/g, ' ');
  s = s.replace(/\s+/g, ' ').trim();
  return s.slice(0, 40);
}

function autoCategory(key, rawDesc, amount) {
  if (data.rules[key]) return data.rules[key];
  // A merchant match wins regardless of sign: a positive amount at a known
  // expense merchant is a credit/refund and stays in that expense category
  // (e.g. a returned Amazon purchase stays under Shopping), while a match on
  // the income rule stays income. Only genuine income-rule hits become
  // 'income'; anything unrecognized goes to review, never silently income.
  for (const [re, cat] of KEYWORD_RULES) {
    if (re.test(key)) return cat;
  }
  return 'uncat';
}

// Learn from a manual re-categorization and apply to other uncategorized
// transactions with the same merchant key.
function learnRule(key, categoryId) {
  if (!key || categoryId === 'uncat') return 0;
  data.rules[key] = categoryId;
  let n = 0;
  for (const t of data.transactions) {
    if (t.merchantKey === key && t.categoryId === 'uncat') { t.categoryId = categoryId; n++; }
  }
  return n;
}

/* ---------- transfer detection ---------- */
function looksLikeTransfer(desc) {
  return TRANSFER_RE.test((desc || '').toUpperCase().replace(/[^A-Z0-9 ]+/g, ' ').replace(/\s+/g, ' '));
}

// Pair-match: opposite amount in a different account within 4 days.
function detectTransferPairs(newTxns) {
  let n = 0;
  const all = data.transactions;
  for (const t of newTxns) {
    if (t.isTransfer) continue;
    for (const o of all) {
      if (o.id === t.id || o.accountId === t.accountId) continue;
      if (o.amount !== -t.amount || t.amount === 0) continue;
      if (Math.abs(dayDiff(o.date, t.date)) > 4) continue;
      if (o._paired) continue;
      t.isTransfer = true; o.isTransfer = true;
      t._paired = true; o._paired = true;
      n++;
      break;
    }
  }
  return n;
}

/* ---------- CSV parsing ---------- */
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQ = false;
      } else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = '';
      if (row.length > 1 || row[0].trim() !== '') rows.push(row);
      row = [];
    } else field += c;
  }
  row.push(field);
  if (row.length > 1 || row[0].trim() !== '') rows.push(row);
  return rows;
}

function parseDateStr(s) {
  if (!s) return null;
  s = s.trim().replace(/^"|"$/g, '');
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);           // YYYY-MM-DD
  if (m) return mk(m[1], m[2], m[3]);
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);     // MM/DD/YYYY
  if (m) return mk(m[3], m[1], m[2]);
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2})$/);    // MM/DD/YY
  if (m) return mk('20' + m[3], m[1], m[2]);
  m = s.match(/^([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})/); // Jul 1, 2026
  if (m) {
    const mi = MONTH_NAMES.findIndex(n => n.toLowerCase().startsWith(m[1].toLowerCase().slice(0, 3)));
    if (mi >= 0) return mk(m[3], mi + 1, m[2]);
  }
  return null;
  function mk(y, mo, d) {
    mo = Number(mo); d = Number(d);
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    return y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }
}

function parseAmountStr(s) {
  if (s == null) return null;
  s = String(s).trim();
  if (s === '') return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (/DR$/i.test(s)) { neg = true; s = s.replace(/DR$/i, ''); }
  if (/CR$/i.test(s)) { s = s.replace(/CR$/i, ''); }
  s = s.replace(/[$,\s]/g, '');
  if (s === '' || s === '-') return null;
  const v = Number(s);
  if (!isFinite(v)) return null;
  return Math.round((neg ? -v : v) * 100);
}

// Guess which columns are which, from headers first, then value shapes.
function detectMapping(rows) {
  const map = { hasHeader: false, dateCol: -1, descCol: -1, mode: 'single', amountCol: -1, debitCol: -1, creditCol: -1, flip: false };
  if (!rows.length) return map;
  const head = rows[0].map(h => h.trim().toLowerCase());
  const find = (res) => head.findIndex(h => res.some(re => re.test(h)));
  const dateIdx = find([/^date$/, /transaction date/, /posting date/, /posted/, /^trans\.? date/]);
  const headerish = dateIdx >= 0 || find([/description|payee|merchant|memo|details|name/]) >= 0;
  if (headerish && !parseDateStr(rows[0][Math.max(dateIdx, 0)])) {
    map.hasHeader = true;
    map.dateCol = dateIdx;
    map.descCol = find([/^description$/, /description/, /payee/, /merchant/, /^name$/, /memo/, /details/]);
    map.amountCol = find([/^amount$/, /^amount \(/, /transaction amount/, /^amt$/]);
    map.debitCol = find([/debit|withdrawal|money out|outflow/]);
    map.creditCol = find([/^credit$|deposit|money in|inflow/]);
    if (map.amountCol < 0 && map.debitCol >= 0 && map.creditCol >= 0) map.mode = 'debitcredit';
  }
  // fill any gaps by inspecting data rows
  const sample = rows.slice(map.hasHeader ? 1 : 0, (map.hasHeader ? 1 : 0) + 8);
  const cols = Math.max(...rows.map(r => r.length));
  const score = { date: [], amount: [], text: [] };
  for (let c = 0; c < cols; c++) {
    let dOk = 0, aOk = 0, tLen = 0;
    for (const r of sample) {
      const v = r[c] || '';
      if (parseDateStr(v)) dOk++;
      else if (parseAmountStr(v) !== null && /\d/.test(v)) aOk++;
      if (/[A-Za-z]{3,}/.test(v)) tLen += v.length;
    }
    score.date[c] = dOk; score.amount[c] = aOk; score.text[c] = tLen;
  }
  const best = arr => arr.indexOf(Math.max(...arr));
  if (map.dateCol < 0 && Math.max(...score.date) > 0) map.dateCol = best(score.date);
  if (map.mode === 'single' && map.amountCol < 0 && Math.max(...score.amount) > 0) map.amountCol = best(score.amount);
  if (map.descCol < 0 && Math.max(...score.text) > 0) {
    // longest-text column that isn't the date column
    const t = score.text.slice();
    if (map.dateCol >= 0) t[map.dateCol] = -1;
    map.descCol = best(t);
  }
  return map;
}

function extractRows(rows, map) {
  const out = [];
  const start = map.hasHeader ? 1 : 0;
  for (let i = start; i < rows.length; i++) {
    const r = rows[i];
    const date = parseDateStr(r[map.dateCol]);
    const desc = (r[map.descCol] || '').trim();
    let amount = null;
    if (map.mode === 'debitcredit') {
      const d = parseAmountStr(r[map.debitCol]);
      const c = parseAmountStr(r[map.creditCol]);
      if (d !== null && d !== 0) amount = -Math.abs(d);
      else if (c !== null && c !== 0) amount = Math.abs(c);
      else if (d === 0 || c === 0) amount = 0;
    } else {
      amount = parseAmountStr(r[map.amountCol]);
      if (amount !== null && map.flip) amount = -amount;
    }
    out.push({ raw: r, date, desc, amount, ok: !!(date && desc !== '' && amount !== null) });
  }
  return out;
}

function fingerprintBase(accountId, date, amount, desc) {
  return accountId + '|' + date + '|' + amount + '|' + merchantKey(desc).slice(0, 30);
}

// Import parsed rows into an account. Duplicate-safe across re-imports:
// identical rows within one file get occurrence-numbered fingerprints so
// legitimate same-day duplicates import, but re-importing the same file skips.
function importRows(parsedRows, accountId) {
  const existing = new Set(data.transactions.map(t => t.fp).filter(Boolean));
  const batchCount = {};
  const added = [];
  let dupes = 0, invalid = 0;
  for (const row of parsedRows) {
    if (!row.ok) { invalid++; continue; }
    const base = fingerprintBase(accountId, row.date, row.amount, row.desc);
    const n = (batchCount[base] = (batchCount[base] || 0) + 1);
    const fp = base + '#' + n;
    if (existing.has(fp)) { dupes++; continue; }
    const key = merchantKey(row.desc);
    const isXfer = looksLikeTransfer(row.desc);
    added.push({
      id: uid(),
      date: row.date,
      amount: row.amount,
      desc: row.desc,
      merchantKey: key,
      accountId,
      categoryId: isXfer ? 'uncat' : autoCategory(key, row.desc, row.amount),
      isTransfer: isXfer,
      source: 'csv',
      fp,
    });
  }
  data.transactions.push(...added);
  detectTransferPairs(added);
  data.transactions.sort((a, b) => b.date.localeCompare(a.date) || (a.id < b.id ? 1 : -1));
  saveData();
  return { added: added.length, dupes, invalid, transfers: added.filter(t => t.isTransfer).length };
}

/* ---------- aggregates ---------- */
function realTxns() { return data.transactions.filter(t => !t.isTransfer); }

// Current balance for an account (transfers included — balances track real
// money movement). Defers to acctBalance() so savings/investment accounts with
// manual snapshots reflect their real (market) value; for accounts without a
// snapshot, folds in the manual starting balance on top of transaction flows.
function accountBalance(accountId) {
  const a = acctById(accountId);
  if (!a) return 0;
  const r = acctBalance(a);
  if (r.hasSnap) return r.balance;
  return r.balance + (Number.isFinite(a.startingBalance) ? a.startingBalance : 0);
}
function netWorth() {
  return data.accounts.reduce((s, a) => s + accountBalance(a.id), 0);
}

function monthTotals(ym) {
  let income = 0, spending = 0;
  const byCat = {};
  for (const t of realTxns()) {
    if (monthKey(t.date) !== ym) continue;
    if (isSavingsAcct(t.accountId)) continue; // tracked in the Savings view, not as income/spending
    // Route by the transaction's CATEGORY, not its sign: amounts in an income
    // category count as income; amounts in an expense category net against
    // that category's spending, so a positive (refund/credit) reduces both the
    // category total and overall spending. Category totals may go negative.
    if (catById(t.categoryId).kind === 'income') {
      income += t.amount;
    } else {
      spending += -t.amount;
      byCat[t.categoryId] = (byCat[t.categoryId] || 0) + -t.amount;
    }
  }
  return { income, spending, net: income - spending, byCat };
}

function lastNMonths(n, endYm) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) out.push(monthAdd(endYm, -i));
  return out;
}

/* ---------- budgeting ---------- */
function daysInMonth(ym) {
  const [y, m] = ym.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}

// How far through a month we are: frac=1 for past months, 0 for future ones,
// day/days while the month is in progress.
function monthProgress(ym) {
  const days = daysInMonth(ym);
  const cur = curMonth();
  if (ym < cur) return { day: days, days, frac: 1 };
  if (ym > cur) return { day: 0, days, frac: 0 };
  const day = Number(todayStr().slice(8, 10));
  return { day, days, frac: day / days };
}

// Aggregate a month's budget picture from an already-computed monthTotals()
// result. Refunds (negative category totals) clamp to 0 so bars and sums never
// go negative. state: ok < 80% <= near <= 100% < over.
function budgetSummary(ym, totals) {
  const rows = [];
  let totalBudget = 0, totalSpent = 0;
  for (const c of data.categories) {
    if (!c.budget || c.kind === 'income') continue;
    const spent = Math.max(0, totals.byCat[c.id] || 0);
    const frac = spent / c.budget;
    rows.push({ cat: c, budget: c.budget, spent, frac, state: frac > 1 ? 'over' : frac >= 0.8 ? 'near' : 'ok' });
    totalBudget += c.budget;
    totalSpent += spent;
  }
  // Expense categories with spend this month but no budget ("everything else").
  const ubMap = {};
  for (const [id, amt] of Object.entries(totals.byCat)) {
    if (amt <= 0) continue;
    const c = catById(id);
    if (c.budget) continue;
    if (ubMap[c.id]) ubMap[c.id].amt += amt;
    else ubMap[c.id] = { cat: c, amt };
  }
  const unbudgeted = Object.values(ubMap).sort((a, b) => b.amt - a.amt);
  const unbudgetedTotal = unbudgeted.reduce((s, u) => s + u.amt, 0);
  return { rows, totalBudget, totalSpent, left: totalBudget - totalSpent, unbudgetedTotal, unbudgeted };
}

// Round a suggested budget up to a friendly step: $5 under $50, $10 under
// $200, $25 above. Cents in, cents out.
function roundBudgetUp(cents) {
  const step = cents < 5000 ? 500 : cents < 20000 ? 1000 : 2500;
  return Math.ceil(cents / step) * step;
}

// Suggest a monthly budget from the last 3 completed months: average of the
// months that actually had spend, but only when at least 2 did (one data point
// is too thin to suggest from). Returns cents, or null when there's no basis.
function suggestBudget(catId) {
  const months = lastNMonths(3, monthAdd(curMonth(), -1));
  const spends = months
    .map(ym => Math.max(0, monthTotals(ym).byCat[catId] || 0))
    .filter(v => v > 0);
  if (spends.length < 2) return null;
  const avg = spends.reduce((s, v) => s + v, 0) / spends.length;
  return roundBudgetUp(avg);
}

/* ---------- recurring detection ---------- */
function median(arr) {
  const s = arr.slice().sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

function detectRecurring() {
  // Group by direction + merchant so expenses (money out) and income (money in,
  // e.g. paychecks) are detected separately and never mixed within a group.
  const groups = {};
  for (const t of realTxns()) {
    if (t.amount === 0 || !t.merchantKey) continue;
    if (isSavingsAcct(t.accountId)) continue; // brokerage buys aren't subscriptions
    const dir = t.amount < 0 ? 'expense' : 'income';
    const gk = dir + '|' + t.merchantKey;
    (groups[gk] = groups[gk] || []).push(t);
  }
  const out = [];
  for (const gk of Object.keys(groups)) {
    const txns = groups[gk];
    if (txns.length < 3) continue;
    const direction = txns[0].amount < 0 ? 'expense' : 'income';
    txns.sort((a, b) => a.date.localeCompare(b.date));
    const intervals = [];
    for (let i = 1; i < txns.length; i++) intervals.push(dayDiff(txns[i - 1].date, txns[i].date));
    const mi = median(intervals);
    let cadence = null, perMonth = 0;
    if (mi >= 5 && mi <= 9) { cadence = 'Weekly'; perMonth = 4.33; }
    else if (mi >= 12 && mi <= 17) { cadence = 'Every 2 weeks'; perMonth = 2.17; }
    else if (mi >= 26 && mi <= 35) { cadence = 'Monthly'; perMonth = 1; }
    else if (mi >= 80 && mi <= 100) { cadence = 'Quarterly'; perMonth = 1 / 3; }
    else if (mi >= 330 && mi <= 400) { cadence = 'Yearly'; perMonth = 1 / 12; }
    if (!cadence) continue;
    const consistent = intervals.filter(v => Math.abs(v - mi) <= Math.max(3, mi * 0.3)).length / intervals.length;
    if (consistent < 0.6) continue;
    const amts = txns.map(t => Math.abs(t.amount));
    const ma = median(amts);
    const amtConsistent = amts.filter(a => Math.abs(a - ma) <= ma * 0.25).length / amts.length;
    if (amtConsistent < 0.6) continue;
    const key = txns[0].merchantKey;
    out.push({
      key,
      name: titleCase(key),
      direction,
      cadence,
      typical: ma,
      perMonthCost: Math.round(ma * perMonth),
      perYearCost: Math.round(ma * perMonth * 12),
      count: txns.length,
      last: txns[txns.length - 1].date,
      categoryId: txns[txns.length - 1].categoryId,
    });
  }
  out.sort((a, b) => b.perMonthCost - a.perMonthCost);
  return out;
}

/* =====================================================================
   UI
   ===================================================================== */
const state = {
  view: 'dashboard',
  dashMonth: curMonth(),
  trendCat: 'all',
  fSearch: '', fAccount: 'all', fCategory: 'all', fMonth: 'all',
  fTransfers: false, fUncatOnly: false,
  editingId: null, showCount: 100,
  addOpen: false,
  budgetEdit: null,       // catId with the inline budget editor open, or null
  unbudgetedOpen: false,  // "Everything else" row expanded on the dashboard
};

// Inline SVG tab icons — 22px, stroke follows the button's currentColor so
// the active/muted tint comes for free. Kept offline-safe (no external assets).
const tabIcon = (paths) =>
  `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;

const VIEWS = [
  ['dashboard', tabIcon('<path d="M5 20v-7"/><path d="M12 20V5"/><path d="M19 20v-10"/><path d="M3 20h18"/>'), 'Overview'],
  ['trends', tabIcon('<polyline points="3 16 9 10 13 13 21 5"/><polyline points="15 5 21 5 21 11"/>'), 'Trends'],
  ['savings', tabIcon('<path d="M3 9.5l9-6 9 6"/><path d="M5 10v7"/><path d="M9.7 10v7"/><path d="M14.3 10v7"/><path d="M19 10v7"/><path d="M3 20h18"/>'), 'Savings'],
  ['transactions', tabIcon('<path d="M9 6h12"/><path d="M9 12h12"/><path d="M9 18h12"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>'), 'Activity'],
  ['recurring', tabIcon('<path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 8 16 8"/>'), 'Recurring'],
  ['settings', tabIcon('<path d="M4 7h4"/><circle cx="11" cy="7" r="2"/><path d="M13 7h7"/><path d="M4 12h9"/><circle cx="15" cy="12" r="2"/><path d="M17 12h3"/><path d="M4 17h1.5"/><circle cx="8.5" cy="17" r="2"/><path d="M10.5 17h9.5"/>'), 'Settings'],
];

function renderTabbar() {
  $('#tabbar').innerHTML = VIEWS.map(([id, ico, lbl]) =>
    `<button data-view="${id}" class="${state.view === id ? 'active' : ''}"><span class="ico">${ico}</span>${lbl}</button>`
  ).join('');
  $$('#tabbar button').forEach(b => b.onclick = () => { state.view = b.dataset.view; state.editingId = null; render(); window.scrollTo(0, 0); });
}

function render() {
  renderTabbar();
  hideTip();
  const app = $('#app');
  if (state.view === 'dashboard') renderDashboard(app);
  else if (state.view === 'trends') renderTrends(app);
  else if (state.view === 'savings') renderSavings(app);
  else if (state.view === 'transactions') renderTransactions(app);
  else if (state.view === 'recurring') renderRecurring(app);
  else renderSettings(app);
}

function emptyState() {
  return `<div class="card empty">
    <div class="big">🌱</div>
    <div><strong>No transactions yet</strong></div>
    <div class="sub" style="margin:6px 0 14px">Import a CSV from your bank, or add a transaction by hand — everything stays on this device.</div>
    <button class="btn" id="empty-import">Import bank CSV</button>
    <button class="btn secondary" id="empty-add" style="margin-left:6px">Add manually</button>
  </div>`;
}
function wireEmpty(el) {
  const i = $('#empty-import', el), a = $('#empty-add', el);
  if (i) i.onclick = openImportModal;
  if (a) a.onclick = () => { state.view = 'transactions'; render(); };
}

/* ---------- dashboard ---------- */
// moneyAbs with the trailing cents wrapped in a span so hero tiles can
// de-emphasize them (only styled under .tile.hero — inert elsewhere).
function moneyAbsHero(cents) {
  const s = moneyAbs(cents);
  const m = s.match(/^(.*)([.,]\d{2})$/);
  return m ? `${m[1]}<span class="cents">${m[2]}</span>` : s;
}

function renderDashboard(app) {
  const ym = state.dashMonth;
  const t = monthTotals(ym);
  const prev = monthTotals(monthAdd(ym, -1));
  const nw = netWorth();
  const hasAny = data.transactions.length > 0;

  let html = `<h1>Overview</h1>
  <div class="monthpick">
    <button id="mp-prev" aria-label="Previous month">‹</button>
    <span class="cur" id="mp-cur" role="button" tabindex="0" aria-label="${esc(monthLabel(ym))} — tap to jump to another month">${monthLabel(ym)}</span>
    <input type="month" id="mp-jump" value="${ym}" max="${curMonth()}" style="display:none" aria-label="Jump to month">
    <button id="mp-next" aria-label="Next month" ${ym >= curMonth() ? 'disabled' : ''}>›</button>
  </div>`;

  if (!hasAny) {
    html += emptyState();
    app.innerHTML = html;
    wireEmpty(app);
    $('#mp-prev').onclick = () => { state.dashMonth = monthAdd(state.dashMonth, -1); render(); };
    wireMonthJump();
    return;
  }

  const saved = savingsFlow(ym, SAVE_TYPES);
  const savedPrev = savingsFlow(monthAdd(ym, -1), SAVE_TYPES);
  const deltaHtml = (cur, prv, upIsGood) => {
    if (!prv) return '';
    const d = cur - prv;
    if (d === 0) return `<div class="delta muted">— same as ${monthShort(monthAdd(ym, -1)).split(' ')[0]}</div>`;
    const good = (d > 0) === upIsGood;
    return `<div class="delta ${good ? 'good' : 'bad'}">${d > 0 ? '▲' : '▼'} ${moneyAbs(d)} vs ${monthShort(monthAdd(ym, -1))}</div>`;
  };

  const bs = budgetSummary(ym, t);
  const mp = monthProgress(ym);
  const hasBudgets = bs.rows.length > 0;
  const isCurMonth = ym === curMonth();
  // Hero becomes "Left to spend" only when budgets exist AND we're looking at
  // the current month; past months and budget-less data keep Net (zero regression).
  const heroBudget = hasBudgets && isCurMonth;

  const netTileInner = `
      <div class="val">${t.net < 0 ? '−' : ''}${moneyAbsHero(t.net)}</div>
      ${deltaHtml(t.net, prev.income || prev.spending ? prev.net : 0, true)}`;
  let heroHtml;
  if (heroBudget) {
    const overCount = bs.rows.filter(r => r.state === 'over').length;
    const expected = Math.round(bs.totalBudget * mp.frac);
    const paceDiff = bs.totalSpent - expected;
    let paceBit;
    if (Math.abs(paceDiff) <= bs.totalBudget * 0.03) paceBit = `<span style="color:var(--good-text)">on pace ✓</span>`;
    else if (paceDiff > 0) paceBit = `<span style="color:var(--critical)">${moneyAbs(paceDiff)} over pace</span>`;
    else paceBit = `<span style="color:var(--good-text)">${moneyAbs(paceDiff)} ahead of pace</span>`;
    const overBit = overCount ? ` · <span style="color:var(--critical)">${overCount} over budget</span>` : '';
    heroHtml = `<div class="tile hero">
      <div class="lbl">Left to spend · ${monthLabel(ym)}</div>
      <div class="val">${bs.left < 0 ? '−' : ''}${moneyAbsHero(bs.left)}${bs.left < 0 ? ' <span class="sub" style="font-size:20px">over</span>' : ''}</div>
      <div class="delta muted">of ${moneyAbs(bs.totalBudget)} budgeted · ${paceBit}${overBit}</div>
    </div>`;
  } else {
    heroHtml = `<div class="tile hero">
      <div class="lbl">Net · ${monthLabel(ym)}</div>${netTileInner}
    </div>`;
  }

  const hasSavedTile = data.accounts.some(a => SAVE_TYPES.includes(a.type));
  // Grid: hero full width, Income/Spending pair, then a Net worth pair —
  // with Net (demoted) when the hero is budget-led, with Saved otherwise.
  // Whichever tile is left alone goes full width so no orphan cell remains.
  html += `<div class="tiles">
    ${heroHtml}
    <div class="tile" data-drill="income" role="button" tabindex="0" aria-label="Income ${moneyAbs(t.income)} in ${esc(monthLabel(ym))} — view income transactions">
      <div class="lbl">Income</div>
      <div class="val">${moneyAbs(t.income)}</div>
      ${deltaHtml(t.income, prev.income, true)}
    </div>
    <div class="tile" data-drill="spending" role="button" tabindex="0" aria-label="Spending ${moneyAbs(t.spending)} in ${esc(monthLabel(ym))} — view spending transactions">
      <div class="lbl">Spending</div>
      <div class="val">${moneyAbs(t.spending)}</div>
      ${deltaHtml(t.spending, prev.spending, false)}
    </div>
    ${heroBudget ? `<div class="tile">
      <div class="lbl">Net · ${monthLabel(ym)}</div>${netTileInner}
    </div>` : ''}
    <div class="tile${!heroBudget && !hasSavedTile ? ' wide' : ''}">
      <div class="lbl">Net worth</div>
      <div class="val">${nw < 0 ? '−' : ''}${moneyAbs(nw)}</div>
      <div class="delta muted">across all accounts</div>
    </div>
    ${hasSavedTile ? `
    <div class="tile${heroBudget ? ' wide' : ''}">
      <div class="lbl">🏦 Saved · into savings & investments</div>
      <div class="val">${saved < 0 ? '−' : '+'}${moneyAbs(saved)}</div>
      ${deltaHtml(saved, savedPrev, true)}
    </div>` : ''}
  </div>`;

  html += budgetCardHtml(ym, t, bs, mp, hasBudgets, isCurMonth);

  // category breakdown — single-series horizontal bars, direct-labeled
  const cats = Object.entries(t.byCat)
    .map(([id, amt]) => ({ cat: catById(id), amt }))
    .sort((a, b) => b.amt - a.amt);
  html += `<div class="card"><h2>Spending by category</h2>`;
  if (!cats.length) {
    html += `<div class="sub">No spending recorded this month.</div>`;
  } else {
    const max = cats[0].amt;
    html += `<div class="cbar">` + cats.map(({ cat, amt }) => {
      const pct = t.spending ? Math.round(amt / t.spending * 100) : 0;
      return `
      <div class="crow" role="button" tabindex="0" data-cat="${esc(cat.id)}" aria-label="${esc(cat.name)}: ${moneyAbs(amt)} in ${esc(monthLabel(ym))} — view transactions">
        <div class="name">${cat.emoji} ${esc(cat.name)}</div>
        <div class="trackcell"><div class="bar" data-tip="${esc(cat.name)}: ${moneyAbs(amt)} (${pct}%)" style="width:${Math.max(1, amt / max * 100)}%;background:${catColor(cat)}"></div></div>
        <div class="amt">${moneyAbs(amt)} <span class="pct">· ${pct}%</span></div>
      </div>`;
    }).join('') + `</div>`;
  }
  html += `</div>`;

  app.innerHTML = html;
  $('#mp-prev').onclick = () => { state.dashMonth = monthAdd(state.dashMonth, -1); render(); };
  $('#mp-next').onclick = () => { state.dashMonth = monthAdd(state.dashMonth, 1); render(); };
  wireMonthJump();
  const gs = $('#goto-settings');
  if (gs) gs.onclick = (e) => { e.preventDefault(); state.view = 'settings'; render(); };

  // Tiles drill into the month's transactions (Spending = expenses, Income = income).
  $$('.tile[data-drill]', app).forEach(el => {
    const act = () => drillToActivity(el.dataset.drill === 'income' ? '__income__' : '__expense__', ym);
    el.onclick = act;
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } };
  });
  // Category rows drill into that category for this month.
  $$('.cbar .crow', app).forEach(el => {
    const act = () => drillToActivity(el.dataset.cat, ym);
    el.onclick = act;
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } };
  });

  // Budget meter rows drill like .crow; the ✎ button toggles the inline editor.
  $$('.meter[data-cat]', app).forEach(el => {
    const act = () => drillToActivity(el.dataset.cat, ym);
    el.onclick = e => { if (e.target.closest && e.target.closest('.budget-edit')) return; act(); };
    el.onkeydown = e => { if (e.target !== el) return; if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } };
  });
  $$('.budget-edit', app).forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      state.budgetEdit = state.budgetEdit === btn.dataset.cat ? null : btn.dataset.cat;
      render();
    };
  });

  // "Everything else" expands into the unbudgeted category list.
  const ubt = $('#ub-toggle', app);
  if (ubt) {
    const tog = () => { state.unbudgetedOpen = !state.unbudgetedOpen; render(); };
    ubt.onclick = tog;
    ubt.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tog(); } };
  }
  $$('.ub-set', app).forEach(chip => {
    const act = () => { state.budgetEdit = chip.dataset.cat; render(); };
    chip.onclick = e => { e.stopPropagation(); act(); };
    chip.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); act(); } };
  });

  wireBudgetEditor(app);

  // Bootstrap card: write all checked budgets at once, or dismiss quietly.
  const bsStart = $('#bs-start', app);
  if (bsStart) bsStart.onclick = () => {
    let n = 0;
    $$('.bs-chk', app).forEach(chk => {
      if (!chk.checked) return;
      const c = data.categories.find(x => x.id === chk.dataset.cat);
      const inp = $(`.bs-amt[data-cat="${chk.dataset.cat}"]`, app);
      const v = inp ? parseFloat(inp.value) : NaN;
      if (c && isFinite(v) && v > 0) { c.budget = Math.round(v * 100); n++; }
    });
    if (!n) { toast('Tick at least one category and give it an amount'); return; }
    saveData(); render();
    toast(`Budgets set for ${n} categor${n === 1 ? 'y' : 'ies'}`);
  };
  const bsLater = $('#bs-later', app);
  if (bsLater) bsLater.onclick = () => {
    if (!data.settings) data.settings = {};
    data.settings.budgetsSetupDismissed = true;
    saveData(); render();
  };
  const reopen = $('#budget-reopen', app);
  if (reopen) reopen.onclick = e => {
    e.preventDefault();
    if (!data.settings) data.settings = {};
    data.settings.budgetsSetupDismissed = false;
    saveData(); render();
  };

  wireBarTips(app);
}

// The dashboard's budget card: overall bar + pace copy, per-category meters
// (over → near → ok, remaining-first labels), the "Everything else" rollup,
// and — when no budgets exist yet — the one-time setup card.
function budgetCardHtml(ym, t, bs, mp, hasBudgets, isCurMonth) {
  if (!hasBudgets) {
    if (data.settings && data.settings.budgetsSetupDismissed) {
      return `<div class="sub" style="margin:0 2px 12px"><a href="#" id="budget-reopen">Set budgets →</a></div>`;
    }
    return budgetSetupCardHtml();
  }

  const overallPct = bs.totalBudget ? bs.totalSpent / bs.totalBudget : 0;
  const fillColor = overallPct > 1 ? 'var(--critical)' : overallPct >= 0.9 ? 'var(--warning)' : 'var(--accent)';
  let paceLine = '';
  if (isCurMonth) {
    const expected = Math.round(bs.totalBudget * mp.frac);
    const diff = bs.totalSpent - expected;
    if (Math.abs(diff) <= bs.totalBudget * 0.03) paceLine = 'On pace';
    else if (diff > 0) paceLine = `${moneyAbs(diff)} over pace for day ${mp.day}`;
    else paceLine = `${moneyAbs(diff)} ahead of pace`;
    // Projection needs a week of data before it stops being noise.
    if (mp.day > 7 && mp.frac > 0) paceLine += ` · ~${moneyAbs(Math.round(bs.totalSpent / mp.frac))} by month end at this rate`;
  } else if (ym < curMonth()) {
    paceLine = bs.left >= 0 ? `Finished ${moneyAbs(bs.left)} under budget ✓` : `${moneyAbs(bs.left)} over budget`;
  }

  let html = `<div class="card"><h2>Budget · ${monthShort(ym)}</h2>
    <div class="meter overall">
      <div class="top"><span class="nm">${moneyAbs(bs.totalSpent)} of ${moneyAbs(bs.totalBudget)}</span>
        <span class="st">${bs.left >= 0 ? moneyAbs(bs.left) + ' left' : `<span style="color:var(--critical)">${moneyAbs(bs.left)} over</span>`}</span></div>
      <div class="track" role="meter" aria-valuemin="0" aria-valuemax="${Math.round(bs.totalBudget / 100)}" aria-valuenow="${Math.round(bs.totalSpent / 100)}" aria-label="Overall budget"><div class="fill" style="width:${Math.min(100, Math.max(0, overallPct * 100))}%;background:${fillColor}"></div>${isCurMonth ? `<div class="pace-tick" style="left:calc(${(mp.frac * 100).toFixed(1)}% - 1px)"></div>` : ''}</div>
      ${paceLine ? `<div class="sub" style="margin-top:4px">${paceLine}</div>` : ''}
    </div>`;

  const rank = { over: 0, near: 1, ok: 2 };
  const rows = bs.rows.slice().sort((a, b) => (rank[a.state] - rank[b.state]) || (b.frac - a.frac));
  for (const r of rows) {
    const c = r.cat;
    const rem = r.budget - r.spent;
    const w = Math.min(100, Math.max(0, r.frac * 100));
    // Over rows fill the whole track (= everything spent) with a darker
    // right-anchored overage segment past the 100%-of-budget tick, so 105%
    // over reads visibly different from 150% over.
    let trackInner;
    if (r.state === 'over' && r.spent > 0) {
      const capPct = Math.max(0, Math.min(100, r.budget / r.spent * 100));
      trackInner = `<div class="fill" style="width:100%"></div><div class="overage" style="width:${(100 - capPct).toFixed(1)}%"></div><div class="cap-tick" style="left:calc(${capPct.toFixed(1)}% - 1px)"></div>`;
    } else {
      trackInner = `<div class="fill" style="width:${w}%${r.state === 'ok' ? `;background:${catColor(c)}` : ''}"></div>`;
    }
    html += `<div class="meter ${r.state}" data-cat="${esc(c.id)}" role="button" tabindex="0" aria-label="${esc(c.name)}: ${moneyAbs(r.spent)} of ${moneyAbs(r.budget)} budget — view transactions">
      <div class="top"><span class="nm">${c.emoji} ${esc(c.name)}</span>
        <span class="st">${rem >= 0 ? `${moneyAbs(rem)} left` : `<span style="color:var(--critical)">${moneyAbs(rem)} over</span>`}
          <span class="muted" style="font-size:12px">${moneyAbs(r.spent)} / ${moneyAbs(r.budget)}</span></span>
        <button class="iconbtn budget-edit" data-cat="${esc(c.id)}" aria-label="Edit ${esc(c.name)} budget">✎</button></div>
      <div class="track" role="meter" aria-valuemin="0" aria-valuemax="${Math.round(r.budget / 100)}" aria-valuenow="${Math.round(r.spent / 100)}" aria-label="${esc(c.name)} budget">${trackInner}</div>
      ${r.state === 'over' ? `<div class="overnote">⚠️ Over budget by ${moneyAbs(r.spent - r.budget)}</div>` : ''}
    </div>`;
    if (state.budgetEdit === c.id) html += budgetEditorHtml(c);
  }

  if (bs.unbudgeted.length) {
    const nUb = bs.unbudgeted.length;
    const ubW = bs.totalBudget ? Math.min(100, bs.unbudgetedTotal / bs.totalBudget * 100) : 100;
    html += `<div class="meter unbudgeted" id="ub-toggle" role="button" tabindex="0" aria-expanded="${state.unbudgetedOpen}" aria-label="Everything else: ${moneyAbs(bs.unbudgetedTotal)} across ${nUb} unbudgeted categor${nUb === 1 ? 'y' : 'ies'}">
      <div class="top"><span class="nm">📦 Everything else · ${moneyAbs(bs.unbudgetedTotal)} across ${nUb} categor${nUb === 1 ? 'y' : 'ies'}</span>
        <span class="st muted">${state.unbudgetedOpen ? '▲' : '▼'}</span></div>
      <div class="track"><div class="fill" style="width:${ubW}%"></div></div>
    </div>`;
    if (state.unbudgetedOpen) {
      html += `<div class="ub-list">` + bs.unbudgeted.map(u => {
        let h = `<div class="ub-row"><span>${u.cat.emoji} ${esc(u.cat.name)}</span>
          <span class="amt">${moneyAbs(u.amt)}</span>
          <span class="chip ub-set" role="button" tabindex="0" data-cat="${esc(u.cat.id)}">Set budget</span></div>`;
        if (state.budgetEdit === u.cat.id) h += budgetEditorHtml(u.cat);
        return h;
      }).join('') + `</div>`;
      if (t.spending > 0 && bs.unbudgetedTotal > t.spending * 0.25) {
        html += `<div class="sub" style="margin-top:2px">Over a quarter of this month's spending has no budget yet.</div>`;
      }
    }
  }

  html += `</div>`;
  return html;
}

// One-time setup card shown when there are transactions but no budgets yet:
// top 5 expense categories by 3-month average, prefilled with suggestions.
function budgetSetupCardHtml() {
  const compMonths = lastNMonths(3, monthAdd(curMonth(), -1));
  const cand = data.categories
    .filter(c => c.kind !== 'income' && c.id !== 'uncat')
    .map(c => {
      const avg = compMonths.reduce((s, m) => s + Math.max(0, monthTotals(m).byCat[c.id] || 0), 0) / compMonths.length;
      return { cat: c, avg, sug: suggestBudget(c.id) };
    })
    .filter(x => x.avg > 0)
    .sort((a, b) => b.avg - a.avg)
    .slice(0, 5);
  if (!cand.length) {
    return `<div class="card"><h2>Budget</h2>
      <div class="sub">No budgets set. Add monthly limits per category in <a href="#" id="goto-settings">Settings</a>.</div></div>`;
  }
  return `<div class="card budget-setup"><h2>Start budgeting</h2>
    <div class="sub" style="margin-bottom:8px">We drafted these from your last 3 months of spending — adjust or untick, then start.</div>
    ${cand.map(x => `<div class="bsrow">
      <label class="chk"><input type="checkbox" class="bs-chk" data-cat="${esc(x.cat.id)}" checked> ${x.cat.emoji} ${esc(x.cat.name)}</label>
      <input type="number" class="bs-amt" min="0" step="1" inputmode="decimal" data-cat="${esc(x.cat.id)}" value="${((x.sug != null ? x.sug : roundBudgetUp(x.avg)) / 100).toFixed(0)}" aria-label="Monthly budget for ${esc(x.cat.name)}">
    </div>`).join('')}
    <div class="row" style="margin-top:10px">
      <button class="btn" id="bs-start">Start budgeting</button>
      <button class="btn secondary" id="bs-later">Not now</button>
    </div>
  </div>`;
}

// Inline budget editor rendered under the row being edited. Prefills with the
// current budget, or the suggestion when none is set yet.
function budgetEditorHtml(c) {
  const sug = suggestBudget(c.id);
  const val = c.budget ? (c.budget / 100).toFixed(0) : (sug != null ? (sug / 100).toFixed(0) : '');
  return `<div class="budget-editor" data-cat="${esc(c.id)}">
    <label class="fld"><span>${c.emoji} ${esc(c.name)} budget ($ / month)</span>
      <input type="number" id="be-amt" min="0" step="1" inputmode="decimal" placeholder="e.g. 400" value="${val}"></label>
    ${sug != null ? `<div class="sub" style="margin:-2px 0 10px">Suggested: <span class="chip" id="be-sug" role="button" tabindex="0">${moneyAbs(sug)} (3-mo avg)</span></div>` : ''}
    <div class="row">
      <button class="btn small" id="be-save">Save</button>
      ${c.budget ? `<button class="btn secondary small" id="be-remove">Remove budget</button>` : ''}
      <button class="btn secondary small" id="be-cancel">Cancel</button>
    </div>
  </div>`;
}

// Save/remove semantics identical to the Settings budget inputs — two doors,
// one field (cat.budget in cents, null = no budget).
function wireBudgetEditor(root) {
  const ed = $('.budget-editor', root);
  if (!ed) return;
  const c = data.categories.find(x => x.id === ed.dataset.cat);
  if (!c) return;
  const save = () => {
    const v = parseFloat($('#be-amt', ed).value);
    c.budget = isFinite(v) && v > 0 ? Math.round(v * 100) : null;
    saveData(); state.budgetEdit = null; render();
    toast(c.budget ? `${c.name} budget: ${moneyAbs(c.budget)}/month` : `${c.name} budget removed`);
  };
  $('#be-save', ed).onclick = save;
  $('#be-amt', ed).onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); save(); } };
  const rm = $('#be-remove', ed);
  if (rm) rm.onclick = () => {
    c.budget = null; saveData(); state.budgetEdit = null; render();
    toast(`${c.name} budget removed`);
  };
  $('#be-cancel', ed).onclick = () => { state.budgetEdit = null; render(); };
  const sugChip = $('#be-sug', ed);
  if (sugChip) {
    const fill = () => {
      const s = suggestBudget(c.id);
      if (s != null) $('#be-amt', ed).value = (s / 100).toFixed(0);
    };
    sugChip.onclick = fill;
    sugChip.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fill(); } };
  }
}

// Switch to the Activity view with a category + month filter applied, clearing
// unrelated filters so the drill-down shows exactly what was tapped.
function drillToActivity(categoryFilter, month) {
  state.fCategory = categoryFilter;
  state.fMonth = month;
  state.fSearch = '';
  state.fAccount = 'all';
  state.fUncatOnly = false;
  state.fTransfers = false;
  state.showCount = 100;
  state.view = 'transactions';
  render();
  window.scrollTo(0, 0);
}

// Reveal a native month input over the month label for quick jumping.
function wireMonthJump() {
  const cur = $('#mp-cur'), jump = $('#mp-jump');
  if (!cur || !jump) return;
  const open = () => {
    cur.style.display = 'none';
    jump.style.display = '';
    jump.focus();
    if (jump.showPicker) { try { jump.showPicker(); } catch (e) { /* not supported */ } }
  };
  cur.onclick = open;
  cur.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
  jump.onchange = () => {
    const v = jump.value;
    if (v && /^\d{4}-\d{2}$/.test(v) && v <= curMonth()) { state.dashMonth = v; render(); }
    else { cur.style.display = ''; jump.style.display = 'none'; }
  };
  jump.onblur = () => { cur.style.display = ''; jump.style.display = 'none'; };
}

/* ---------- trends ---------- */
function renderTrends(app) {
  const months = lastNMonths(12, curMonth());
  const catSel = state.trendCat;
  const expenseCats = data.categories.filter(c => c.kind !== 'income');

  let series;
  if (catSel === 'all') {
    const inc = [], spd = [];
    for (const ym of months) { const t = monthTotals(ym); inc.push(t.income); spd.push(t.spending); }
    series = [
      { name: 'Spending', color: 'var(--series-1)', values: spd },
      { name: 'Income', color: 'var(--series-2)', values: inc },
    ];
  } else {
    const vals = months.map(ym => monthTotals(ym).byCat[catSel] || 0);
    series = [{ name: catById(catSel).name, color: catColor(catById(catSel)), values: vals }];
  }

  let html = `<h1>Trends</h1>
  <div class="card">
    <div class="row" style="margin-bottom:10px">
      <h2 style="margin:0">Last 12 months</h2>
      <select id="trend-cat" class="right" style="width:auto">
        <option value="all">Income vs spending</option>
        ${expenseCats.map(c => `<option value="${c.id}" ${catSel === c.id ? 'selected' : ''}>${c.emoji} ${esc(c.name)}</option>`).join('')}
      </select>
    </div>`;

  if (!data.transactions.length) {
    html += `<div class="sub">Nothing to chart yet.</div></div>`;
    app.innerHTML = html;
    $('#trend-cat').onchange = e => { state.trendCat = e.target.value; render(); };
    return;
  }

  html += `<div class="legend">` + series.map(s =>
    `<span class="key"><span class="swatch" style="background:${s.color}"></span>${esc(s.name)}${series.length === 1 ? ` · ${moneyAbs(s.values[s.values.length - 1])}` : ''}</span>`).join('') + `</div>`;
  html += `<div class="chartwrap" id="trend-chart"></div></div>`;

  // table twin — every charted value reachable without hover
  html += `<div class="card"><h2>By month</h2><div class="preview-scroll" style="border:0"><table class="mini">
    <tr><th>Month</th>${series.map(s => `<th class="num">${esc(s.name)}</th>`).join('')}${series.length > 1 ? '<th class="num">Net</th>' : ''}</tr>`;
  for (let i = months.length - 1; i >= 0; i--) {
    html += `<tr><td>${monthShort(months[i])}</td>` +
      series.map(s => `<td class="num">${moneyAbs(s.values[i])}</td>`).join('') +
      (series.length > 1 ? `<td class="num">${money(series[1].values[i] - series[0].values[i])}</td>` : '') + `</tr>`;
  }
  html += `</table></div></div>`;

  app.innerHTML = html;
  $('#trend-cat').onchange = e => { state.trendCat = e.target.value; render(); };
  drawLineChart($('#trend-chart'), months, series);
}

function niceCeil(v) {
  if (v <= 0) return 100;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}

function drawLineChart(container, months, series) {
  // Trim leading months where every series is zero — no point charting the
  // silence before the data starts. Always keep at least 6 points.
  let off = 0;
  while (months.length - off > 6 && series.every(s => !(s.values[off]))) off++;
  const ms = months.slice(off);
  const sers = series.map(s => ({ name: s.name, color: s.color, values: s.values.slice(off) }));

  // The whole chart is built inside draw() so a resize can rebuild it from the
  // container's live width; no DOM refs survive between draws.
  const draw = () => {
    const W = Math.max(340, container.clientWidth || 0);
    const H = W < 480 ? 220 : 260;
    const padL = 52, padR = 56, padT = 14, padB = 26;
    const iw = W - padL - padR, ih = H - padT - padB;
    const maxV = niceCeil(Math.max(1, ...sers.flatMap(s => s.values)));
    const x = i => padL + (ms.length === 1 ? iw / 2 : i * iw / (ms.length - 1));
    const y = v => padT + ih - (v / maxV) * ih;
    const TICKS = 4;
    let g = '';
    for (let t = 0; t <= TICKS; t++) {
      const v = maxV * t / TICKS, yy = y(v);
      g += `<line x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>`;
      g += `<text x="${padL - 8}" y="${yy + 4}" text-anchor="end" font-size="12.5" fill="var(--text-secondary)" style="font-variant-numeric:tabular-nums">${moneyCompact(v)}</text>`;
    }
    // x labels: as many as fit at ~52px each, anchored so the last month is
    // always labeled.
    const step = Math.max(1, Math.ceil(ms.length / Math.max(1, Math.floor(iw / 52))));
    let xl = '';
    ms.forEach((m, i) => {
      if ((ms.length - 1 - i) % step === 0) {
        xl += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="12.5" fill="var(--text-secondary)">${monthShort(m)}</text>`;
      }
    });
    let paths = '';
    const endLabels = [];
    for (const s of sers) {
      const pts = s.values.map((v, i) => `${x(i)},${y(v)}`).join(' ');
      paths += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      // Point markers distinguish series even without color (e.g. Savings' two lines).
      s.values.forEach((v, i) => {
        const last = i === s.values.length - 1;
        paths += `<circle cx="${x(i)}" cy="${y(v)}" r="${last ? 4 : 2.5}" fill="${s.color}" stroke="var(--surface-1)" stroke-width="${last ? 2 : 1}"/>`;
      });
      const li = s.values.length - 1;
      endLabels.push({ ly: y(s.values[li]) + 4, text: moneyCompact(s.values[li]) });
    }
    // End-label collision: keep labels at least 14px apart vertically.
    endLabels.forEach(l => { l.ly = Math.max(padT + 10, Math.min(padT + ih, l.ly)); });
    endLabels.sort((a, b) => a.ly - b.ly);
    for (let i = 1; i < endLabels.length; i++) {
      if (endLabels[i].ly - endLabels[i - 1].ly < 14) endLabels[i].ly = endLabels[i - 1].ly + 14;
    }
    for (const l of endLabels) {
      paths += `<text x="${x(ms.length - 1) + 8}" y="${l.ly}" text-anchor="start" font-size="12" font-weight="600" fill="var(--text-secondary)" style="font-variant-numeric:tabular-nums">${l.text}</text>`;
    }
    container.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly trend chart">
      ${g}
      <line x1="${padL}" y1="${padT + ih}" x2="${W - padR}" y2="${padT + ih}" stroke="var(--baseline)" stroke-width="1"/>
      ${xl}${paths}
      <line id="xh" x1="0" y1="${padT}" x2="0" y2="${padT + ih}" stroke="var(--baseline)" stroke-width="1" style="display:none"/>
      <rect id="hit" x="${padL}" y="${padT}" width="${iw}" height="${ih}" fill="transparent"/>
    </svg>`;

    const svg = $('svg', container), hit = $('#hit', container), xh = $('#xh', container);
    const tip = $('#viztip');
    function onMove(ev) {
      const r = svg.getBoundingClientRect();
      const sx = (ev.clientX - r.left) * (W / r.width);
      let idx = Math.round((sx - padL) / (iw / Math.max(1, ms.length - 1)));
      idx = Math.max(0, Math.min(ms.length - 1, idx));
      const cx = x(idx);
      xh.setAttribute('x1', cx); xh.setAttribute('x2', cx);
      xh.style.display = '';
      tip.innerHTML = '';
      const t0 = document.createElement('div'); t0.className = 't'; t0.textContent = monthLabel(ms[idx]);
      tip.appendChild(t0);
      for (const s of sers) {
        const row = document.createElement('div'); row.className = 'r';
        const k = document.createElement('span'); k.className = 'k'; k.style.background = s.color;
        const v = document.createElement('span'); v.className = 'v'; v.textContent = moneyAbs(s.values[idx]);
        const n = document.createElement('span'); n.className = 'n'; n.textContent = s.name;
        row.append(k, v, n); tip.appendChild(row);
      }
      showTipAt(ev.clientX, ev.clientY);
    }
    hit.addEventListener('pointermove', onMove);
    hit.addEventListener('pointerdown', onMove);
    hit.addEventListener('pointerleave', () => { xh.style.display = 'none'; hideTip(); });
  };

  draw();
  // Latest chart wins the shared redraw slot; a stale container simply fails
  // the isConnected check after the next render() replaces the view.
  drawLineChart._redraw = () => { if (container.isConnected) draw(); };
}

// One debounced window listener redraws whichever chart is currently on
// screen at its new width (registered once at boot).
window.addEventListener('resize', () => {
  clearTimeout(drawLineChart._t);
  drawLineChart._t = setTimeout(() => { if (drawLineChart._redraw) drawLineChart._redraw(); }, 200);
});
