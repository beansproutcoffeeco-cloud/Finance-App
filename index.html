/* tooltip plumbing (shared) */
function showTipAt(cx, cy) {
  const tip = $('#viztip');
  tip.style.display = 'block';
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let lx = cx + 14, ly = cy - th - 10;
  if (lx + tw > window.innerWidth - 8) lx = cx - tw - 14;
  if (ly < 8) ly = cy + 16;
  tip.style.left = Math.max(8, lx) + 'px';
  tip.style.top = ly + 'px';
}
function hideTip() { $('#viztip').style.display = 'none'; }
function wireBarTips(root) {
  $$('[data-tip]', root).forEach(el => {
    const show = ev => {
      const tip = $('#viztip');
      tip.textContent = el.dataset.tip;
      showTipAt(ev.clientX, ev.clientY);
    };
    el.addEventListener('pointermove', show);
    el.addEventListener('pointerdown', show);
    el.addEventListener('pointerleave', hideTip);
  });
}

/* ---------- transactions ---------- */
// Interpret a search query as an amount filter: a single number (exact match on
// the absolute dollar amount) or a "min-max" range. Returns cents bounds, or
// null when the query isn't numeric (so text/category matching applies instead).
function parseAmountQuery(q) {
  q = q.trim().replace(/[$,\s]/g, '');
  const range = q.match(/^(\d+(?:\.\d+)?)-(\d+(?:\.\d+)?)$/);
  if (range) {
    let a = Math.round(parseFloat(range[1]) * 100), b = Math.round(parseFloat(range[2]) * 100);
    if (a > b) { const tmp = a; a = b; b = tmp; }
    return { min: a, max: b };
  }
  if (/^\d+(?:\.\d+)?$/.test(q)) {
    const c = Math.round(parseFloat(q) * 100);
    return { min: c, max: c };
  }
  return null;
}

function txnMatchesFilters(t) {
  if (!state.fTransfers && t.isTransfer) return false;
  if (state.fUncatOnly && !(t.categoryId === 'uncat' && !t.isTransfer)) return false;
  if (state.fAccount !== 'all' && t.accountId !== state.fAccount) return false;
  if (state.fCategory === '__expense__') { if (catById(t.categoryId).kind === 'income') return false; }
  else if (state.fCategory === '__income__') { if (catById(t.categoryId).kind !== 'income') return false; }
  else if (state.fCategory !== 'all' && t.categoryId !== state.fCategory) return false;
  if (state.fMonth !== 'all' && monthKey(t.date) !== state.fMonth) return false;
  if (state.fSearch) {
    const amtQ = parseAmountQuery(state.fSearch);
    if (amtQ) {
      const abs = Math.abs(t.amount);
      if (abs < amtQ.min || abs > amtQ.max) return false;
    } else {
      const q = state.fSearch.toLowerCase();
      if (!(t.desc || '').toLowerCase().includes(q) && !catById(t.categoryId).name.toLowerCase().includes(q) && !(t.merchantKey || '').toLowerCase().includes(q)) return false;
    }
  }
  return true;
}

function renderTransactions(app) {
  const uncatN = data.transactions.filter(t => t.categoryId === 'uncat' && !t.isTransfer).length;
  if (!uncatN) state.fUncatOnly = false; // review queue emptied — drop its filter

  const monthsPresent = [...new Set(data.transactions.map(t => monthKey(t.date)))].sort().reverse();

  let html = `<h1>Activity</h1>
  <div class="card">
    <div class="row" id="addtxn-toggle" role="button" tabindex="0" aria-expanded="${state.addOpen}" style="cursor:pointer">
      <h2 style="margin:0">＋ Add transaction</h2>
      <span class="right muted" aria-hidden="true">${state.addOpen ? '▲' : '▼'}</span>
    </div>
    <form id="quickadd" style="margin-top:12px;${state.addOpen ? '' : 'display:none'}">
      <div class="grid2">
        <label class="fld"><span>Amount ($)</span><input type="number" step="0.01" min="0" inputmode="decimal" id="qa-amt" required placeholder="12.50"></label>
        <label class="fld"><span>Type</span><select id="qa-type"><option value="expense">Expense</option><option value="income">Income</option></select></label>
        <label class="fld"><span>Date</span><input type="date" id="qa-date" value="${todayStr()}" required></label>
        <label class="fld"><span>Category</span><select id="qa-cat">${data.categories.filter(c => c.id !== 'uncat').map(c => `<option value="${c.id}">${c.emoji} ${esc(c.name)}</option>`).join('')}</select></label>
        <label class="fld" style="grid-column:1/-1"><span>Description</span><input type="text" id="qa-desc" placeholder="e.g. Farmers market" required></label>
        <label class="fld"><span>Account</span><select id="qa-acct">${data.accounts.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></label>
        <div style="display:flex;align-items:flex-end;padding-bottom:2px"><button class="btn" style="width:100%">Add</button></div>
      </div>
    </form>
  </div>

  <div class="row" style="margin:14px 0 10px">
    <h2 style="margin:0">Transactions</h2>
    <button class="btn small right" id="open-import">Import CSV</button>
  </div>
  <div class="filters">
    <input type="search" id="f-search" placeholder="Search text or amount (12, 10-50)…" value="${esc(state.fSearch)}">
    <select id="f-acct"><option value="all">All accounts</option>${data.accounts.map(a => `<option value="${a.id}" ${state.fAccount === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
    <select id="f-cat"><option value="all">All categories</option><option value="__expense__" ${state.fCategory === '__expense__' ? 'selected' : ''}>All expenses</option><option value="__income__" ${state.fCategory === '__income__' ? 'selected' : ''}>All income</option>${data.categories.map(c => `<option value="${c.id}" ${state.fCategory === c.id ? 'selected' : ''}>${c.emoji} ${esc(c.name)}</option>`).join('')}</select>
    <select id="f-month"><option value="all">All months</option>${monthsPresent.map(m => `<option value="${m}" ${state.fMonth === m ? 'selected' : ''}>${monthLabel(m)}</option>`).join('')}</select>
    <label class="chk"><input type="checkbox" id="f-xfer" ${state.fTransfers ? 'checked' : ''}> Show transfers</label>
  </div>`;

  if (uncatN) {
    html += `<div style="margin-bottom:10px"><span class="chip ${state.fUncatOnly ? 'on' : ''}" id="chip-uncat">❓ Needs review · ${uncatN}</span></div>`;
  }

  const matches = data.transactions.filter(txnMatchesFilters);
  // Bulk-categorize bar: only while the review queue filter is active and it
  // actually has items in view (all matches are uncat when fUncatOnly is on).
  if (state.fUncatOnly && matches.length) {
    html += `<div class="card" id="bulk-bar" style="padding:10px 12px;margin-bottom:10px">
      <div class="row">
        <span class="sub" style="flex:0 0 auto">Set category for all ${matches.length} shown:</span>
        <select id="bulk-cat" class="grow" style="flex:1 1 140px">${data.categories.filter(c => c.id !== 'uncat').map(c => `<option value="${c.id}">${c.emoji} ${esc(c.name)}</option>`).join('')}</select>
        <button class="btn small" id="bulk-apply">Apply to all shown</button>
      </div>
      <label class="chk" style="margin:8px 0 0;display:flex;gap:6px;font-size:13px;color:var(--text-secondary)">
        <input type="checkbox" id="bulk-learn" checked> Also remember by merchant (learn rules for these)
      </label>
    </div>`;
  }
  if (!data.transactions.length) {
    html += emptyState();
  } else if (!matches.length) {
    html += `<div class="card empty"><div>No transactions match these filters.</div></div>`;
  } else {
    const shown = matches.slice(0, state.showCount);
    let lastDay = '', groupOpen = false;
    for (const t of shown) {
      if (t.date !== lastDay) {
        if (groupOpen) html += `</div>`;
        html += `<div class="dayhdr">${dateLabel(t.date)}</div><div class="daygroup">`;
        groupOpen = true;
        lastDay = t.date;
      }
      html += txnRowHtml(t);
      if (state.editingId === t.id) html += txnEditorHtml(t);
    }
    if (groupOpen) html += `</div>`;
    if (matches.length > shown.length) {
      html += `<div style="text-align:center;margin:12px 0"><button class="btn secondary" id="show-more">Show more (${matches.length - shown.length} left)</button></div>`;
    }
  }

  app.innerHTML = html;
  wireEmpty(app);

  const addToggle = $('#addtxn-toggle');
  if (addToggle) {
    const tog = () => { state.addOpen = !state.addOpen; render(); };
    addToggle.onclick = tog;
    addToggle.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tog(); } };
  }

  $('#quickadd').onsubmit = e => {
    e.preventDefault();
    const dollars = parseFloat($('#qa-amt').value);
    if (!isFinite(dollars) || dollars <= 0) return;
    const type = $('#qa-type').value;
    const amount = Math.round(dollars * 100) * (type === 'expense' ? -1 : 1);
    const desc = $('#qa-desc').value.trim();
    data.transactions.push({
      id: uid(), date: $('#qa-date').value, amount, desc,
      merchantKey: merchantKey(desc), accountId: $('#qa-acct').value,
      categoryId: $('#qa-cat').value, isTransfer: false, source: 'manual', fp: null,
    });
    data.transactions.sort((a, b) => b.date.localeCompare(a.date) || (a.id < b.id ? 1 : -1));
    saveData();
    toast('Added ' + moneyAbs(amount));
    render();
  };
  $('#open-import').onclick = openImportModal;
  $('#f-search').oninput = e => { state.fSearch = e.target.value; state.showCount = 100; renderListOnly(); };
  $('#f-acct').onchange = e => { state.fAccount = e.target.value; render(); };
  $('#f-cat').onchange = e => { state.fCategory = e.target.value; render(); };
  $('#f-month').onchange = e => { state.fMonth = e.target.value; render(); };
  $('#f-xfer').onchange = e => { state.fTransfers = e.target.checked; render(); };
  const chip = $('#chip-uncat');
  if (chip) chip.onclick = () => { state.fUncatOnly = !state.fUncatOnly; render(); };
  const bulkApply = $('#bulk-apply');
  if (bulkApply) bulkApply.onclick = () => {
    const cat = $('#bulk-cat').value;
    if (!cat || cat === 'uncat') return;
    const learn = $('#bulk-learn').checked;
    const targets = data.transactions.filter(txnMatchesFilters);
    const keys = new Set();
    let n = 0;
    for (const t of targets) {
      if (t.categoryId === 'uncat' && !t.isTransfer) {
        t.categoryId = cat; n++;
        if (t.merchantKey) keys.add(t.merchantKey);
      }
    }
    if (learn) for (const k of keys) learnRule(k, cat);
    data.transactions.sort((a, b) => b.date.localeCompare(a.date) || (a.id < b.id ? 1 : -1));
    saveData();
    render();
    toast(`Categorized ${n} transaction${n === 1 ? '' : 's'} as ${catById(cat).name}`);
  };
  const more = $('#show-more');
  if (more) more.onclick = () => { state.showCount += 200; render(); };
  wireTxnRows(app);
  wireEditor(app);

  // re-render just the list on search keystrokes without losing input focus
  function renderListOnly() { render(); const s = $('#f-search'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}

function txnRowHtml(t) {
  const c = catById(t.categoryId);
  const acct = acctById(t.accountId);
  const amtCls = t.isTransfer ? 'xfer' : (t.amount > 0 ? 'pos' : '');
  const sign = t.amount > 0 ? '+' : '';
  const label = `${t.desc || 'Transaction'}, ${sign}${money(t.amount)}, ${t.isTransfer ? 'transfer' : c.name} — edit`;
  return `<div class="txn${t.categoryId === 'uncat' && !t.isTransfer ? ' uncat' : ''}${state.editingId === t.id ? ' editing' : ''}" data-id="${t.id}" role="button" tabindex="0" aria-label="${esc(label)}">
    <div class="emoji">${t.isTransfer ? '🔀' : c.emoji}</div>
    <div class="mid">
      <div class="desc">${esc(t.desc)}</div>
      <div class="meta">${t.isTransfer ? 'Transfer · ' : esc(c.name) + ' · '}${acct ? esc(acct.name) : ''}</div>
    </div>
    <div class="amt ${amtCls}">${sign}${money(t.amount)}</div>
  </div>`;
}

function txnEditorHtml(t) {
  return `<div class="editor" data-editor="${t.id}">
    <div class="grid2">
      <label class="fld"><span>Date</span><input type="date" id="ed-date" value="${t.date}"></label>
      <label class="fld"><span>Amount ($)</span><input type="number" step="0.01" id="ed-amt" value="${(t.amount / 100).toFixed(2)}"><span class="hint">Negative = expense, positive = money in</span></label>
      <label class="fld"><span>Category</span><select id="ed-cat">${data.categories.map(c => `<option value="${c.id}" ${t.categoryId === c.id ? 'selected' : ''}>${c.emoji} ${esc(c.name)}</option>`).join('')}</select></label>
      <label class="fld"><span>Account</span><select id="ed-acct">${data.accounts.map(a => `<option value="${a.id}" ${t.accountId === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></label>
      <label class="fld" style="grid-column:1/-1"><span>Description</span><input type="text" id="ed-desc" value="${esc(t.desc)}"></label>
    </div>
    <label class="chk" style="margin:2px 0 10px;display:flex;gap:6px;font-size:13px;color:var(--text-secondary)">
      <input type="checkbox" id="ed-xfer" ${t.isTransfer ? 'checked' : ''}> This is a transfer between my accounts (excluded from totals)
    </label>
    <div class="row">
      <button class="btn" id="ed-save">Save</button>
      <button class="btn secondary" id="ed-cancel">Cancel</button>
      <button class="btn danger small right" id="ed-delete">Delete</button>
    </div>
  </div>`;
}

function wireTxnRows(root) {
  $$('.txn', root).forEach(el => {
    const act = () => {
      state.editingId = state.editingId === el.dataset.id ? null : el.dataset.id;
      render();
    };
    el.onclick = act;
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } };
  });
}

function wireEditor(root) {
  const ed = $('.editor', root);
  if (!ed) return;
  const t = data.transactions.find(x => x.id === ed.dataset.editor);
  if (!t) return;
  $('#ed-cancel', ed).onclick = () => { state.editingId = null; render(); };
  $('#ed-delete', ed).onclick = () => {
    if (!confirm('Delete this transaction?')) return;
    // Keep the removed object in memory so it can be restored from the toast.
    const removed = t;
    data.transactions = data.transactions.filter(x => x.id !== t.id);
    saveData(); state.editingId = null; render();
    toast('Deleted', { label: 'Undo', fn: () => {
      data.transactions.push(removed);
      data.transactions.sort((a, b) => b.date.localeCompare(a.date) || (a.id < b.id ? 1 : -1));
      saveData(); render(); toast('Transaction restored');
    } });
  };
  $('#ed-save', ed).onclick = () => {
    const newCat = $('#ed-cat', ed).value;
    const dollars = parseFloat($('#ed-amt', ed).value);
    if (isFinite(dollars)) t.amount = Math.round(dollars * 100);
    t.date = $('#ed-date', ed).value || t.date;
    t.desc = $('#ed-desc', ed).value.trim() || t.desc;
    t.merchantKey = merchantKey(t.desc);
    t.accountId = $('#ed-acct', ed).value;
    t.isTransfer = $('#ed-xfer', ed).checked;
    let learned = 0;
    if (newCat !== t.categoryId) {
      t.categoryId = newCat;
      learned = learnRule(t.merchantKey, newCat);
    }
    data.transactions.sort((a, b) => b.date.localeCompare(a.date) || (a.id < b.id ? 1 : -1));
    saveData(); state.editingId = null; render();
    toast(learned > 0 ? `Saved — rule learned, ${learned} similar transaction${learned > 1 ? 's' : ''} updated` : 'Saved');
  };
}

/* ---------- savings & investments ---------- */
function renderSavings(app) {
  const saveAccts = data.accounts.filter(a => SAVE_TYPES.includes(a.type));
  let html = `<h1>Savings & Investments</h1>`;

  if (!saveAccts.length) {
    html += `<div class="card empty"><div class="big">🏦</div>
      <div><strong>No savings or investment accounts yet</strong></div>
      <div class="sub" style="margin:6px 0 14px">Import your savings or brokerage CSV as a new account (pick the account type in the import dialog), or mark an existing account as Savings / Investment in Settings.</div>
      <button class="btn" id="sv-import">Import CSV</button>
      <button class="btn secondary" id="sv-settings" style="margin-left:6px">Open Settings</button>
    </div>`;
    app.innerHTML = html;
    $('#sv-import').onclick = openImportModal;
    $('#sv-settings').onclick = () => { state.view = 'settings'; render(); };
    return;
  }

  const ym = curMonth();
  const added = savingsFlow(ym, SAVE_TYPES);
  const totalBal = saveAccts.reduce((s, a) => s + acctBalance(a).balance, 0);
  const anySnap = saveAccts.some(a => acctBalance(a).hasSnap);
  html += `<div class="tiles">
    <div class="tile"><div class="lbl">Total balance</div><div class="val">${moneyAbs(totalBal)}</div>
      ${anySnap ? '' : '<div class="delta muted">from transactions only — set balances below</div>'}</div>
    <div class="tile"><div class="lbl">Added · ${monthLabel(ym)}</div><div class="val">${added < 0 ? '−' : '+'}${moneyAbs(added)}</div></div>
  </div>`;

  // 12-month contributions chart (net added per month; withdrawals show in the table)
  const months = lastNMonths(12, ym);
  const series = [];
  if (data.accounts.some(a => a.type === 'savings')) {
    series.push({ name: 'Savings', color: 'var(--series-1)', values: months.map(m => Math.max(0, savingsFlow(m, ['savings']))) });
  }
  if (data.accounts.some(a => a.type === 'investment')) {
    series.push({ name: 'Investments', color: 'var(--series-2)', values: months.map(m => Math.max(0, savingsFlow(m, ['investment']))) });
  }
  html += `<div class="card"><h2>Money added per month</h2>`;
  if (series.length) {
    html += `<div class="legend">` + series.map(s =>
      `<span class="key"><span class="swatch" style="background:${s.color}"></span>${esc(s.name)}${series.length === 1 ? ` · ${moneyAbs(s.values[s.values.length - 1])}` : ''}</span>`).join('') + `</div>`;
  }
  html += `<div class="chartwrap" id="sv-chart"></div>
    <div class="preview-scroll" style="border:0;margin-top:8px"><table class="mini">
    <tr><th>Month</th>${series.map(s => `<th class="num">${esc(s.name)}</th>`).join('')}</tr>`;
  for (let i = months.length - 1; i >= 0; i--) {
    html += `<tr><td>${monthShort(months[i])}</td>` +
      series.map(s => {
        const real = savingsFlow(months[i], s.name === 'Savings' ? ['savings'] : ['investment']);
        return `<td class="num">${real < 0 ? '−' : ''}${moneyAbs(real)}</td>`;
      }).join('') + `</tr>`;
  }
  html += `</table></div></div>`;

  // per-account cards
  for (const a of saveAccts) {
    const b = acctBalance(a);
    const flowThisMonth = savingsFlow(ym, SAVE_TYPES, a.id);
    const gains = a.type === 'investment' ? marketGains(a) : null;
    html += `<div class="card">
      <div class="row" style="margin-bottom:6px">
        <h2 style="margin:0">${a.type === 'investment' ? '📈' : '🏦'} ${esc(a.name)}</h2>
        <span class="chip right" style="cursor:default">${ACCT_TYPE_LABELS[a.type] || a.type}</span>
      </div>
      <div style="font-size:26px;font-weight:650">${b.balance < 0 ? '−' : ''}${moneyAbs(b.balance)}</div>
      <div class="sub" style="margin:2px 0 10px">
        ${b.hasSnap ? `balance set ${dateLabel(b.since)}, plus activity since` : 'from imported activity only — enter today’s balance below for accuracy'}
        · this month ${flowThisMonth < 0 ? '−' : '+'}${moneyAbs(flowThisMonth)}
      </div>
      ${gains ? `<div class="sub" style="margin-bottom:10px">📊 Market ${gains.gain >= 0 ? 'gain' : 'loss'} since ${dateLabel(gains.from)}: <strong style="color:${gains.gain >= 0 ? 'var(--good-text)' : 'var(--critical)'}">${gains.gain >= 0 ? '+' : '−'}${moneyAbs(gains.gain)}</strong> (balance change minus money you added)</div>`
        : (a.type === 'investment' ? `<div class="sub" style="margin-bottom:10px">Update the balance now and again after your next statement — the difference minus contributions = your market gains.</div>` : '')}
      <div class="row">
        <input type="number" step="0.01" min="0" inputmode="decimal" class="bal-input grow" data-acct="${a.id}" placeholder="Current balance ($)">
        <button class="btn small bal-save" data-acct="${a.id}">Update balance</button>
      </div>
    </div>`;
  }

  html += `<div class="sub" style="margin:4px 2px 12px">Transfers into these accounts are excluded from your spending and income numbers, and counted here instead. Balances are stored on this device like everything else.</div>`;

  app.innerHTML = html;
  drawLineChart($('#sv-chart'), months, series);
  $$('.bal-save', app).forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.acct;
      const input = $(`.bal-input[data-acct="${id}"]`, app);
      const v = parseFloat(input.value);
      if (!isFinite(v) || v < 0) { toast('Enter the account’s current balance in dollars'); return; }
      const today = todayStr();
      data.balances = (data.balances || []).filter(s => !(s.accountId === id && s.date === today));
      data.balances.push({ id: uid(), accountId: id, date: today, balance: Math.round(v * 100) });
      saveData(); render(); toast('Balance updated');
    };
  });
}

/* ---------- recurring ---------- */
function renderRecurring(app) {
  const recs = detectRecurring();
  let html = `<h1>Recurring</h1>`;
  if (!data.transactions.length) {
    html += emptyState();
    app.innerHTML = html; wireEmpty(app); return;
  }
  if (!recs.length) {
    html += `<div class="card empty"><div class="big">🔁</div><div><strong>No recurring charges detected yet</strong></div>
      <div class="sub" style="margin-top:6px">Detection needs at least 3 charges from the same merchant at a steady weekly, monthly, or yearly rhythm — import a few months of history and check back.</div></div>`;
    app.innerHTML = html; return;
  }
  // Cost totals stay expenses-only so recurring income never inflates them.
  const expenses = recs.filter(r => r.direction !== 'income');
  const income = recs.filter(r => r.direction === 'income');
  const perMonth = expenses.reduce((s, r) => s + r.perMonthCost, 0);
  const perYear = expenses.reduce((s, r) => s + r.perYearCost, 0);
  html += `<div class="tiles">
    <div class="tile"><div class="lbl">Recurring / month</div><div class="val">${moneyAbs(perMonth)}</div></div>
    <div class="tile"><div class="lbl">Recurring / year</div><div class="val">${moneyAbs(perYear)}</div></div>
  </div>
  <div class="card"><h2>Detected subscriptions & bills</h2>`;
  html += expenses.length ? recTableHtml(expenses, false) : `<div class="sub">No recurring expenses detected.</div>`;
  html += `<div class="sub" style="margin-top:8px">Detected from your history: same merchant, similar amount, steady rhythm. Estimates only. Tap a row to see its transactions.</div></div>`;

  if (income.length) {
    const incMonth = income.reduce((s, r) => s + r.perMonthCost, 0);
    html += `<div class="card"><h2>Recurring income</h2>
      <div class="sub" style="margin-bottom:8px">Steady deposits like paychecks — about ${moneyAbs(incMonth)}/month.</div>`;
    html += recTableHtml(income, true);
    html += `</div>`;
  }
  app.innerHTML = html;
  $$('.rec-row', app).forEach(row => {
    row.onclick = () => {
      state.fSearch = row.dataset.merchant;
      state.fUncatOnly = false;
      state.showCount = 100;
      state.view = 'transactions';
      render();
      window.scrollTo(0, 0);
    };
  });
}

// One recurring list (expenses or income). Income rows get a + sign and are
// tinted green; every row is tappable to drill into its transactions.
// Renders BOTH a table (≥600px) and a card list (<600px); CSS shows one.
function recTableHtml(list, isIncome) {
  const col = isIncome ? ' style="color:var(--good-text)"' : '';
  const sign = isIncome ? '+' : '';
  let h = `<div class="preview-scroll rec-table" style="border:0"><table class="mini">
  <tr><th>Merchant</th><th>Cadence</th><th class="num">Typical</th><th class="num">/month</th><th class="num">/year</th></tr>`;
  for (const r of list) {
    const c = catById(r.categoryId);
    h += `<tr class="rec-row" data-merchant="${esc(r.name)}" style="cursor:pointer"><td>${c.emoji} ${esc(r.name)}<div class="muted" style="font-size:12px">last ${dateLabel(r.last)} · ${r.count}×</div></td>
      <td>${r.cadence}</td><td class="num"${col}>${sign}${moneyAbs(r.typical)}</td>
      <td class="num"${col}>${sign}${moneyAbs(r.perMonthCost)}</td><td class="num"${col}>${sign}${moneyAbs(r.perYearCost)}</td></tr>`;
  }
  h += `</table></div>`;
  // Mobile: one card row per merchant so nothing gets cut off horizontally.
  h += `<div class="rec-cards">` + list.map(r => {
    const c = catById(r.categoryId);
    return `<div class="rec-card rec-row" data-merchant="${esc(r.name)}" role="button" tabindex="0" aria-label="${esc(r.name)}, ${r.cadence}, ${sign}${moneyAbs(r.typical)} typical — view transactions">
      <div class="row" style="gap:8px;flex-wrap:nowrap">
        <span class="rc-name">${c.emoji} ${esc(r.name)}</span>
        <span class="chip" style="cursor:inherit">${r.cadence}</span>
      </div>
      <div class="rc-meta"${col}>${sign}${moneyAbs(r.typical)} typical · ${sign}${moneyAbs(r.perMonthCost)}/mo · ${sign}${moneyAbs(r.perYearCost)}/yr</div>
      <div class="rc-meta muted">last ${dateLabel(r.last)} · ${r.count}×</div>
    </div>`;
  }).join('') + `</div>`;
  return h;
}

/* ---------- settings ---------- */
function renderSettings(app) {
  let html = `<h1>Settings</h1>

  <div class="card"><h2>Categories & monthly budgets</h2>
    <div id="cat-list">
    <div class="setrow sethdr" aria-hidden="true">
      <span style="width:24px"></span>
      <span class="grow">Category</span>
      <span>Budget / month</span>
      <span style="width:40px"></span>
    </div>`;
  for (const c of data.categories) {
    if (c.id === 'uncat') continue;
    html += `<div class="setrow" data-cat="${c.id}">
      <span style="width:24px;text-align:center">${c.emoji}</span>
      <input type="text" class="cat-name" value="${esc(c.name)}" aria-label="Category name">
      ${c.kind === 'income' ? '<span class="muted" style="font-size:12px">income</span>'
        : `<span class="moneyfield"><span class="aff">$</span><input type="number" class="budget" min="0" step="1" placeholder="—" value="${c.budget ? (c.budget / 100).toFixed(0) : ''}" aria-label="Monthly budget"><span class="aff">/mo</span></span>`}
      <button class="iconbtn cat-del" title="Delete category" aria-label="Delete ${esc(c.name)}">✕</button>
    </div>`;
  }
  html += `</div>
    <div class="row" style="margin-top:10px">
      <input type="text" id="new-cat-name" placeholder="New category name" class="grow">
      <button class="btn small" id="add-cat">Add</button>
    </div>
    <div class="sub" style="margin-top:8px">Budgets are per calendar month. Deleting a category moves its transactions to Uncategorized.</div>
  </div>

  <div class="card"><h2>Accounts</h2><div id="acct-list">`;
  for (const a of data.accounts) {
    const n = data.transactions.filter(t => t.accountId === a.id).length;
    const bal = accountBalance(a.id);
    const start = Number.isFinite(a.startingBalance) ? a.startingBalance : 0;
    html += `<div class="setrow" data-acct="${a.id}" style="flex-wrap:wrap">
      <input type="text" class="acct-name" value="${esc(a.name)}" aria-label="Account name">
      <select class="acct-type" aria-label="Account type" style="width:auto;flex:0 0 auto;padding:6px 8px;font-size:12.5px">
        ${['bank', 'cash', 'savings', 'investment'].map(ty =>
          `<option value="${ty}" ${(a.type === ty || (!ACCT_TYPE_LABELS[a.type] && ty === 'bank')) ? 'selected' : ''}>${ACCT_TYPE_LABELS[ty]}</option>`).join('')}
      </select>
      <span class="muted" style="font-size:12px;flex:0 0 auto">${n} txns</span>
      <button class="iconbtn acct-del" title="Delete account">✕</button>
      <div class="row" style="flex:1 0 100%;margin-top:4px">
        <label class="fld" style="margin:0;flex:0 0 auto"><span style="display:inline">Starting balance ($)</span>
          <input type="number" class="acct-start budget" step="0.01" value="${(start / 100).toFixed(2)}" aria-label="Starting balance"></label>
        <span class="muted right" style="font-size:12px">Balance: <strong style="color:var(--text-primary)">${bal < 0 ? '−' : ''}${moneyAbs(bal)}</strong></span>
      </div>
    </div>`;
  }
  html += `</div>
    <div class="row" style="margin-top:10px">
      <input type="text" id="new-acct-name" placeholder="New account name (e.g. Chase Checking)" class="grow">
      <button class="btn small" id="add-acct">Add</button>
    </div>
    <div class="sub" style="margin-top:8px">Net worth: <strong>${netWorth() < 0 ? '−' : ''}${moneyAbs(netWorth())}</strong> across all accounts. Balances include transfers.</div>
  </div>

  <div class="card"><h2>Currency</h2>
    <label class="fld" style="margin-bottom:0"><span>Display currency</span>
      <select id="currency-sel">
        ${['USD','EUR','GBP','CAD','AUD','JPY','INR'].map(code => `<option value="${code}" ${((data.settings && data.settings.currency) || 'USD') === code ? 'selected' : ''}>${code}</option>`).join('')}
      </select></label>
    <div class="sub" style="margin-top:8px">Changes how amounts are displayed. Stored amounts are unchanged.</div>
  </div>

  <div class="card"><h2>Your data</h2>
    <div class="sub" style="margin-bottom:10px">Everything is stored only in this browser on this device. Export a backup before clearing the browser data, and to move between your phone and computer.</div>
    <div class="row">
      <button class="btn" id="export-json">Export backup</button>
      <button class="btn secondary" id="import-json">Restore backup</button>
      <button class="btn secondary" id="export-csv">Export CSV</button>
      <input type="file" id="import-json-file" accept=".json,application/json" style="display:none">
    </div>
    <div class="danger-zone">
      <button class="btn danger small" id="reset-all">Erase all data</button>
    </div>
  </div>

  <div class="card"><h2>Learned rules</h2>
    <div class="sub">${Object.keys(data.rules).length} auto-categorization rule${Object.keys(data.rules).length === 1 ? '' : 's'} learned from your corrections. Re-categorize any transaction to teach a new one.</div>
    ${Object.keys(data.rules).length ? '<div class="row" style="margin-top:8px"><button class="btn secondary small" id="clear-rules">Forget all rules</button></div>' : ''}
  </div>

  <div class="sub" style="text-align:center;margin:16px 0">💰 Finance Tracker · offline · your data never leaves this device</div>`;

  app.innerHTML = html;

  // categories (the [data-cat] guard skips the header row)
  $$('#cat-list .setrow[data-cat]').forEach(row => {
    const id = row.dataset.cat;
    const cat = catById(id);
    $('.cat-name', row).onchange = e => { cat.name = e.target.value.trim() || cat.name; saveData(); };
    const b = $('.budget', row);
    if (b) b.onchange = e => {
      const v = parseFloat(e.target.value);
      cat.budget = isFinite(v) && v > 0 ? Math.round(v * 100) : null;
      saveData(); toast(cat.budget ? `${cat.name} budget: ${moneyAbs(cat.budget)}/mo` : `${cat.name} budget removed`);
    };
    $('.cat-del', row).onclick = () => {
      const n = data.transactions.filter(t => t.categoryId === id).length;
      if (!confirm(`Delete "${cat.name}"?${n ? ` ${n} transaction(s) will move to Uncategorized.` : ''}`)) return;
      data.transactions.forEach(t => { if (t.categoryId === id) t.categoryId = 'uncat'; });
      for (const k of Object.keys(data.rules)) if (data.rules[k] === id) delete data.rules[k];
      data.categories = data.categories.filter(c => c.id !== id);
      saveData(); render();
    };
  });
  $('#add-cat').onclick = () => {
    const name = $('#new-cat-name').value.trim();
    if (!name) return;
    const color = CAT_PALETTE[data.categories.length % CAT_PALETTE.length];
    data.categories.splice(data.categories.length - 1, 0, { id: uid(), name, emoji: '🏷️', color, kind: 'expense', budget: null });
    saveData(); render();
  };

  // accounts
  $$('#acct-list .setrow').forEach(row => {
    const id = row.dataset.acct;
    const a = acctById(id);
    $('.acct-name', row).onchange = e => { a.name = e.target.value.trim() || a.name; saveData(); };
    $('.acct-type', row).onchange = e => {
      a.type = e.target.value;
      saveData(); render();
      toast(`${a.name} is now a ${ACCT_TYPE_LABELS[a.type].toLowerCase()} account`);
    };
    const sb = $('.acct-start', row);
    if (sb) sb.onchange = e => {
      const v = parseFloat(e.target.value);
      a.startingBalance = isFinite(v) ? Math.round(v * 100) : 0;
      saveData(); render();
    };
    $('.acct-del', row).onclick = () => {
      const n = data.transactions.filter(t => t.accountId === id).length;
      if (data.accounts.length === 1) { toast('Keep at least one account'); return; }
      if (!confirm(`Delete "${a.name}"?${n ? ` Its ${n} transaction(s) will be deleted too.` : ''}`)) return;
      data.transactions = data.transactions.filter(t => t.accountId !== id);
      data.accounts = data.accounts.filter(x => x.id !== id);
      data.balances = (data.balances || []).filter(b => b.accountId !== id);
      delete data.csvMappings[id];
      saveData(); render();
    };
  });
  $('#add-acct').onclick = () => {
    const name = $('#new-acct-name').value.trim();
    if (!name) return;
    data.accounts.push({ id: uid(), name, type: 'bank', startingBalance: 0 });
    saveData(); render();
  };

  // currency
  $('#currency-sel').onchange = e => {
    if (!data.settings) data.settings = {};
    data.settings.currency = e.target.value;
    buildFormatter();
    saveData();
    render();
    toast('Currency set to ' + e.target.value);
  };

  // data
  $('#export-json').onclick = () => {
    const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'finance-backup-' + todayStr() + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast('Backup downloaded');
  };
  $('#export-csv').onclick = () => {
    if (!data.transactions.length) { toast('No transactions to export'); return; }
    const header = ['Date', 'Description', 'Amount', 'Category', 'Account', 'Transfer'];
    const lines = [header.map(csvCell).join(',')];
    for (const t of data.transactions) {
      const acct = acctById(t.accountId);
      lines.push([
        t.date,
        t.desc,
        (t.amount / 100).toFixed(2),
        catById(t.categoryId).name,
        acct ? acct.name : '',
        t.isTransfer ? 'Yes' : 'No',
      ].map(csvCell).join(','));
    }
    const blob = new Blob([lines.join('\r\n')], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'transactions-' + todayStr() + '.csv';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast('Transactions exported');
  };
  $('#import-json').onclick = () => $('#import-json-file').click();
  $('#import-json-file').onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result);
        if (!d || d.version !== 1 || !Array.isArray(d.transactions) || !Array.isArray(d.categories)) throw new Error('bad');
        if (!confirm(`Restore backup with ${d.transactions.length} transactions? This replaces everything currently here.`)) return;
        data = d; buildFormatter(); saveData(); render(); toast('Backup restored');
      } catch (err) { toast('⚠️ Not a valid backup file'); }
    };
    rd.readAsText(f);
  };
  $('#reset-all').onclick = () => {
    if (!confirm('Erase ALL data on this device? Export a backup first if you want to keep it.')) return;
    if (!confirm('Really erase everything? This cannot be undone.')) return;
    data = defaultData(); buildFormatter(); saveData(); render(); toast('All data erased');
  };
  const cr = $('#clear-rules');
  if (cr) cr.onclick = () => { data.rules = {}; saveData(); render(); toast('Rules cleared'); };
}

/* ---------- CSV import modal ---------- */
let importCtx = null; // { rows, map, accountId }

function openImportModal() {
  importCtx = { rows: null, map: null };
  const root = $('#modal-root');
  root.innerHTML = `<div class="overlay" id="ovl"><div class="sheet">
    <div class="grab" aria-hidden="true"></div>
    <div class="row" style="margin-bottom:8px"><h2 style="margin:0">Import bank CSV</h2>
      <button class="iconbtn right" id="m-close" style="font-size:18px" aria-label="Close">✕</button></div>

    <label class="fld"><span>Into account</span>
      <select id="m-acct">
        ${data.accounts.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}
        <option value="__new__">＋ New account…</option>
      </select></label>
    <label class="fld" id="m-newacct-wrap" style="display:none"><span>New account name</span>
      <input type="text" id="m-newacct" placeholder="e.g. Chase Checking"></label>
    <label class="fld" id="m-newacct-type-wrap" style="display:none"><span>Account type</span>
      <select id="m-newacct-type">
        <option value="bank">Checking / card — counts as spending & income</option>
        <option value="savings">Savings — tracked in the Savings tab</option>
        <option value="investment">Investment / brokerage — tracked in the Savings tab</option>
      </select></label>

    <label class="fld"><span>CSV file</span>
      <input type="file" id="m-file" class="hidden-file" accept=".csv,text/csv,text/plain">
      <span class="btn secondary filelike">Choose CSV file…</span>
      <span class="sub" id="m-fname" style="margin-left:8px"></span></label>
    <label class="fld"><span>…or paste CSV text</span><textarea id="m-paste" rows="4" placeholder="Date,Description,Amount&#10;07/01/2026,COFFEE SHOP,-4.50"></textarea></label>

    <div id="m-mapping" style="display:none">
      <h2 style="margin-top:14px">Columns</h2>
      <div class="grid2">
        <label class="fld"><span>Date column</span><select id="m-datecol"></select></label>
        <label class="fld"><span>Description column</span><select id="m-desccol"></select></label>
        <label class="fld"><span>Amount format</span>
          <select id="m-mode">
            <option value="single">One amount column (±)</option>
            <option value="debitcredit">Separate debit / credit columns</option>
          </select></label>
        <label class="fld" id="m-amtwrap"><span>Amount column</span><select id="m-amtcol"></select></label>
        <label class="fld" id="m-debwrap" style="display:none"><span>Debit (money out) column</span><select id="m-debcol"></select></label>
        <label class="fld" id="m-credwrap" style="display:none"><span>Credit (money in) column</span><select id="m-credcol"></select></label>
      </div>
      <label class="chk" style="display:flex;gap:6px;font-size:13px;color:var(--text-secondary);margin:2px 0 10px" id="m-flipwrap">
        <input type="checkbox" id="m-flip"> Flip signs — for credit-card CSVs where purchases are positive numbers
      </label>
      <h2>Preview</h2>
      <div class="preview-scroll" id="m-preview"></div>
      <div class="sub" id="m-summary" style="margin:8px 0"></div>
      <button class="btn" id="m-import" style="width:100%">Import</button>
    </div>
  </div></div>`;

  const close = () => { root.innerHTML = ''; importCtx = null; };
  $('#m-close').onclick = close;
  $('#ovl').onclick = e => { if (e.target.id === 'ovl') close(); };

  $('#m-acct').onchange = e => {
    const isNew = e.target.value === '__new__';
    $('#m-newacct-wrap').style.display = isNew ? '' : 'none';
    $('#m-newacct-type-wrap').style.display = isNew ? '' : 'none';
    if (importCtx.rows) {
      const detected = detectMapping(importCtx.rows);
      importCtx.map = mappingFromSaved(e.target.value, importCtx.rows, detected) || detected;
      buildMappingUI();
    }
  };
  $('#m-file').onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    $('#m-fname').textContent = f.name;
    const rd = new FileReader();
    rd.onload = () => loadCsvText(String(rd.result));
    rd.readAsText(f);
  };
  let pasteTimer;
  $('#m-paste').oninput = e => {
    clearTimeout(pasteTimer);
    pasteTimer = setTimeout(() => loadCsvText(e.target.value), 250);
  };

  function loadCsvText(text) {
    if (!text.trim()) return;
    const rows = parseCSV(text);
    if (rows.length < 1) { toast('Could not read any rows'); return; }
    importCtx.rows = rows;
    const detected = detectMapping(rows);
    importCtx.map = mappingFromSaved($('#m-acct').value, rows, detected) || detected;
    buildMappingUI();
  }

  // Reuse a previously-saved column mapping for the chosen account so repeat
  // imports from the same bank don't need re-mapping — but only when the saved
  // columns still fit this file's column count; otherwise return null and let
  // detection's guess stand. Header detection always comes from the new file.
  function mappingFromSaved(accountId, rows, detected) {
    const sm = data.csvMappings && data.csvMappings[accountId];
    if (!sm) return null;
    const cols = Math.max(...rows.map(r => r.length));
    const inRange = i => Number.isInteger(i) && i >= 0 && i < cols;
    const dc = sm.mode === 'debitcredit';
    if (dc ? (!inRange(sm.debitCol) || !inRange(sm.creditCol)) : !inRange(sm.amountCol)) return null;
    if (!inRange(sm.dateCol) || !inRange(sm.descCol)) return null;
    return {
      hasHeader: detected.hasHeader,
      dateCol: sm.dateCol,
      descCol: sm.descCol,
      mode: dc ? 'debitcredit' : 'single',
      amountCol: sm.amountCol,
      debitCol: sm.debitCol,
      creditCol: sm.creditCol,
      flip: !!sm.flip,
    };
  }

  function colOptions(selIdx) {
    const rows = importCtx.rows;
    const cols = Math.max(...rows.map(r => r.length));
    const head = importCtx.map.hasHeader ? rows[0] : null;
    let html = '';
    for (let c = 0; c < cols; c++) {
      const name = head && head[c] ? head[c] : 'Column ' + (c + 1);
      html += `<option value="${c}" ${c === selIdx ? 'selected' : ''}>${esc(name)}</option>`;
    }
    return html;
  }

  function buildMappingUI() {
    const m = importCtx.map;
    $('#m-mapping').style.display = '';
    $('#m-datecol').innerHTML = colOptions(m.dateCol);
    $('#m-desccol').innerHTML = colOptions(m.descCol);
    $('#m-amtcol').innerHTML = colOptions(m.amountCol);
    $('#m-debcol').innerHTML = colOptions(m.debitCol);
    $('#m-credcol').innerHTML = colOptions(m.creditCol);
    $('#m-mode').value = m.mode;
    $('#m-flip').checked = m.flip;
    syncModeVisibility();
    refreshPreview();

    $('#m-datecol').onchange = e => { m.dateCol = +e.target.value; refreshPreview(); };
    $('#m-desccol').onchange = e => { m.descCol = +e.target.value; refreshPreview(); };
    $('#m-amtcol').onchange = e => { m.amountCol = +e.target.value; refreshPreview(); };
    $('#m-debcol').onchange = e => { m.debitCol = +e.target.value; refreshPreview(); };
    $('#m-credcol').onchange = e => { m.creditCol = +e.target.value; refreshPreview(); };
    $('#m-mode').onchange = e => { m.mode = e.target.value; syncModeVisibility(); refreshPreview(); };
    $('#m-flip').onchange = e => { m.flip = e.target.checked; refreshPreview(); };
    $('#m-import').onclick = doImport;
  }

  function syncModeVisibility() {
    const dc = importCtx.map.mode === 'debitcredit';
    $('#m-amtwrap').style.display = dc ? 'none' : '';
    $('#m-flipwrap').style.display = dc ? 'none' : '';
    $('#m-debwrap').style.display = dc ? '' : 'none';
    $('#m-credwrap').style.display = dc ? '' : 'none';
  }

  function refreshPreview() {
    const parsed = extractRows(importCtx.rows, importCtx.map);
    const ok = parsed.filter(r => r.ok).length;
    const bad = parsed.length - ok;
    let html = `<table class="mini"><tr><th>Date</th><th>Description</th><th class="num">Amount</th></tr>`;
    for (const r of parsed.slice(0, 6)) {
      html += r.ok
        ? `<tr><td>${r.date}</td><td>${esc(r.desc.slice(0, 40))}</td><td class="num" style="${r.amount > 0 ? 'color:var(--good-text)' : ''}">${money(r.amount)}</td></tr>`
        : `<tr><td colspan="3" class="badrow">✕ couldn’t parse: ${esc(r.raw.join(',').slice(0, 60))}</td></tr>`;
    }
    html += `</table>`;
    $('#m-preview').innerHTML = html;
    $('#m-summary').textContent = `${ok} row${ok === 1 ? '' : 's'} ready to import` + (bad ? ` · ${bad} unreadable (will be skipped)` : '');
    $('#m-import').disabled = ok === 0;
  }

  function doImport() {
    let accountId = $('#m-acct').value;
    if (accountId === '__new__') {
      const name = $('#m-newacct').value.trim();
      if (!name) { toast('Name the new account first'); return; }
      accountId = uid();
      data.accounts.push({ id: accountId, name, type: $('#m-newacct-type').value || 'bank', startingBalance: 0 });
    }
    const parsed = extractRows(importCtx.rows, importCtx.map);
    data.csvMappings[accountId] = { ...importCtx.map };
    const res = importRows(parsed, accountId);
    close();
    render();
    const bits = [`Imported ${res.added} transaction${res.added === 1 ? '' : 's'}`];
    if (res.dupes) bits.push(`${res.dupes} duplicate${res.dupes === 1 ? '' : 's'} skipped`);
    if (res.transfers) bits.push(`${res.transfers} transfer${res.transfers === 1 ? '' : 's'} detected`);
    if (res.invalid) bits.push(`${res.invalid} unreadable`);
    toast(bits.join(' · '));
  }

  // pre-select remembered mapping's account? (mapping restored on import per account)
}

/* ---------- boot ---------- */
render();

// Offline support when hosted (no-op when opened as a local file)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
